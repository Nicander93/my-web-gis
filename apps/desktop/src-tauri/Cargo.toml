[package]
name = "desktop-webgis"
default-run = "desktop-webgis"
version = "0.1.0"
description = "Lightweight 2D desktop GIS workspace"
authors = ["Desktop WebGIS"]
edition = "2021"

[lib]
name = "desktop_webgis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# Default TLS verification ON (rustls). Do not enable danger_accept_invalid_certs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }

[[bin]]
name = "desktop-webgis"
path = "src/main.rs"

[[bin]]
name = "secure-credential-probe"
path = "src/bin/secure_credential_probe.rs"
