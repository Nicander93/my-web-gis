<div class="stage"><div class="app-label"><strong>my-web-gis</strong>　/　二维地图　/　属性表</div><section class="shell"><div class="shell-tabs" id="tabStrip"></div><div class="shell-tools"><input class="search" id="tableSearch" placeholder="搜索当前表格" aria-label="表格搜索"><button id="reopen" title="字段计算器">字段计算器…</button><span class="meta" id="backMeta"></span></div><div id="shellContent"></div><div class="shell-foot">表格为操作上下文示意。字段计算独立于属性表窗口。</div></section><div class="workspace-note">UX 原型 · 用于讨论基本工作流程，示例数据仅在此页面内修改。</div></div>
<div class="calculator" id="calculator" role="dialog" aria-label="字段计算器" aria-modal="false"><div class="calculator-head" id="dragHeader"><strong>字段计算器</strong><span class="calc-context" id="layerLabel">河流水系</span><div class="calc-head-actions"><button id="calcClose" title="关闭计算器" aria-label="关闭计算器">×</button></div></div><div class="calc-body"><div class="mode-line"><span>操作</span><div class="seg"><button id="modeNew" class="on">新建字段</button><button id="modeUpdate">更新已有字段</button></div></div><div class="target-grid"><label><span id="fieldLabel">新字段名称</span><input id="newField" value="流量_千立方米" placeholder="输入名称"><select id="existingField" hidden></select></label><label>字段类型<select id="fieldType"><option value="number">数值</option><option value="string">文本</option><option value="boolean">布尔</option></select></label><label>计算范围<select id="scope"><option value="all">全部要素</option><option value="filtered">图层过滤后</option><option value="visible">当前表格结果</option><option value="selected">选中要素</option></select></label></div><div class="inline-detail" id="scopeDescription"></div><div class="rule"></div><div class="section-head"><span>表达式</span><div class="examples"><small>示例</small><select id="example"><option value="round">流量单位换算</option><option value="class">河流分类</option><option value="concat">名称拼接</option><option value="error">异常数据示例</option></select></div></div><div class="formula-area"><div class="formula-box"><textarea id="expression" spellcheck="false" aria-label="计算表达式"></textarea></div><aside class="assist"><div class="assist-tabs"><button id="fieldsTab" class="on">字段</button><button id="funcTab">函数</button></div><input id="assistSearch" class="assist-search" placeholder="搜索" aria-label="搜索字段或函数"><div class="assist-list" id="assistList"></div></aside></div><div id="validation" class="validation" role="status"></div><div class="rule"></div><div class="section-head"><span>结果预览</span><small id="previewStatus"></small></div><div class="preview"><table><thead><tr><th>记录</th><th id="beforeCol">源数据</th><th>计算结果</th><th style="width:68px">状态</th></tr></thead><tbody id="previewBody"></tbody></table></div><div id="errorList" class="error-list" hidden></div></div><div class="calc-footer"><span id="footStatus" class="footer-status"></span><div class="footer-buttons"><button id="cancelBtn">关闭</button><button id="executeBtn" class="primary">执行计算</button></div></div></div>
<div class="closed-note" id="closed"><span>字段计算器已关闭</span><button id="reopenCenter" class="primary">重新打开</button></div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const seed=[['长江',1,32100,'长江流域'],['黄河',1,1840,'黄河流域'],['汉江',2,5800,'长江流域'],['嘉陵江',2,4500,'长江流域'],['岷江',2,3100,'长江流域'],['湘江',2,2420,'长江流域'],['赣江',2,1950,'长江流域'],['乌江',2,2760,'长江流域'],['沅江',3,1480,'长江流域'],['涪江',3,860,'长江流域'],['大渡河',2,2110,'长江流域'],['雅砻江',2,1820,'长江流域'],['北江',3,720,'珠江流域'],['东江',3,960,'珠江流域'],['西江',1,8960,'珠江流域'],['渭河',3,330,'黄河流域'],['汾河',3,190,'黄河流域'],['洛河',4,0,'黄河流域'],['浑河',3,420,'辽河流域'],['辽河',2,780,'辽河流域'],['松花江',1,1560,'松花江流域'],['嫩江',2,680,'松花江流域'],['额尔古纳河',2,310,'黑龙江流域'],['黑龙江',1,8700,'黑龙江流域']];
const rows=seed.map((x,i)=>({id:`R-${String(i+1).padStart(3,'0')}`,名称:x[0],等级:x[1],流量:x[2],所属流域:x[3]}));
const stations=[{id:'S-001',名称:'青岚水文站',类型:'水文站',流量:240},{id:'S-002',名称:'上游雨量站',类型:'雨量站',流量:60},{id:'S-003',名称:'东河测站',类型:'水文站',流量:125}];
const dset={rivers:{name:'河流水系',rows,open:true},stations:{name:'水文站点',rows:stations,open:true}};let active='rivers',mode='new',assistMode='fields',lastPreview=null,drag=null,toaster=null,prevFocus=null,history=[];const selected=new Set(['R-001','R-002','R-003','R-004']); const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields=()=>Object.keys(dset[active].rows[0]||{}).filter(k=>k!=='id');const typeOf=f=>{const v=dset[active].rows.find(r=>r[f]!=null)?.[f];return typeof v==='number'?'number':typeof v==='boolean'?'boolean':'string'};
const scopeRows=()=>{const rs=dset[active].rows;let arr;const s=$('scope').value;if(s==='selected') arr=rs.filter(r=>selected.has(r.id));else if(s==='filtered') arr=rs.filter(r=>r.等级===undefined||r.等级<=2);else if(s==='visible') arr=rs.filter(r=>(r.等级===undefined||r.等级<=2)&&Object.values(r).some(v=>String(v).includes($('tableSearch').value.trim())));else arr=rs.slice();return arr};
function toast(t){const n=$('toast');n.textContent=t;n.classList.add('show');clearTimeout(toaster);toaster=setTimeout(()=>n.classList.remove('show'),2600)}
function renderTabs(){const strip=$('tabStrip');strip.innerHTML=Object.entries(dset).filter(([,d])=>d.open).map(([id,d])=>`<button class="tab ${active===id?'on':''}" data-tab="${id}">${esc(d.name)} <span class="close-tab" role="button" tabindex="0" data-close-tab="${id}" aria-label="关闭 ${esc(d.name)}">×</span></button>`).join('');strip.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{active=el.dataset.tab;renderShell();refreshFields();preview()}));strip.querySelectorAll('[data-close-tab]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();closeTab(el.dataset.closeTab)}));}
function closeTab(id){dset[id].open=false;const next=Object.keys(dset).find(k=>dset[k].open);if(next){active=next;renderShell();refreshFields();preview()}else{$('shellContent').innerHTML='<p style="padding:20px;color:#7f8b93">没有打开的属性表。 <button id="restoreTable">打开河流水系</button></p>';$('restoreTable').onclick=()=>{dset.rivers.open=true;active='rivers';renderShell();refreshFields();preview()};$('calculator').hidden=true;$('closed').classList.add('show')}renderTabs()}
function renderShell(){renderTabs();const d=dset[active];$('backMeta').textContent=`${d.rows.length} 条记录`;let q=$('tableSearch').value.trim();let rs=d.rows.filter(r=>Object.values(r).some(v=>String(v).includes(q)));const fs=fields().slice(0,5);$('shellContent').innerHTML=`<table class="shell-table"><thead><tr><th style="width:46px">#</th>${fs.map(f=>`<th>${esc(f)}</th>`).join('')}</tr></thead><tbody>${rs.slice(0,12).map((r,i)=>`<tr class="${selected.has(r.id)?'selected':''}"><td>${i+1}</td>${fs.map(f=>`<td>${esc(r[f]??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;if(dset[active].open)$('layerLabel').textContent=d.name;}
function refreshFields(){const fs=fields();$('existingField').innerHTML=fs.map(f=>`<option>${esc(f)}</option>`).join('');$('existingField').value=fs.includes('流量')?'流量':fs[0]??'';if(mode==='update')$('fieldType').value=typeOf($('existingField').value);renderAssist();}
function setMode(m){mode=m;$('modeNew').classList.toggle('on',m==='new');$('modeUpdate').classList.toggle('on',m==='update');$('newField').hidden=m==='update';$('existingField').hidden=m==='new';$('fieldLabel').textContent=m==='new'?'新字段名称':'目标字段';$('fieldType').disabled=m==='update';if(m==='update')$('fieldType').value=typeOf($('existingField').value);preview()}
function renderAssist(){const source=assistMode==='fields'?fields().map(name=>({name,type:typeOf(name),insert:`field(${JSON.stringify(name)})`})):[{name:'round',type:'数值',insert:'round(, 2)'},{name:'abs',type:'数值',insert:'abs()'},{name:'coalesce',type:'空值',insert:'coalesce(, 0)'},{name:'concat',type:'文本',insert:'concat(, "")'},{name:'min',type:'数值',insert:'min(, )'},{name:'max',type:'数值',insert:'max(, )'}];const q=$('assistSearch').value.trim().toLowerCase();$('assistList').innerHTML=source.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<button class="assist-item" data-insert="${esc(x.insert)}"><span>${esc(x.name)}</span><em>${esc(x.type)}</em></button>`).join('');$('assistList').querySelectorAll('[data-insert]').forEach(b=>b.addEventListener('click',()=>insert(b.dataset.insert)))}
function insert(text){const area=$('expression');const a=area.selectionStart,b=area.selectionEnd;area.value=area.value.slice(0,a)+text+area.value.slice(b);area.focus();area.setSelectionRange(a+text.length,a+text.length);preview()}
function tokenize(s){const re=/\s*(?:(\d+(?:\.\d+)?)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|([A-Za-z_][A-Za-z_\d]*)|(===|!==|>=|<=|&&|\|\||\*\*|[+\-*/%()?:,<>!]))/y;const t=[];let at=0;while(at<s.length){re.lastIndex=at;const m=re.exec(s);if(!m){if(/^\s*$/.test(s.slice(at)))break;throw Error(`位置 ${at+1} 附近存在不支持的语法`)}at=re.lastIndex;t.push({v:m[1]??m[2]??m[3]??m[4],kind:m[1]?'num':m[2]?'str':m[3]?'id':'op'})}t.push({v:'EOF'});return t}
function parse(s){const t=tokenize(s);let p=0;const peek=()=>t[p].v;const pop=()=>t[p++];function must(v){if(peek()!==v)throw Error(`需要 ${v}`);pop()}const priority={'||':1,'&&':2,'===':3,'!==':3,'>':4,'<':4,'>=':4,'<=':4,'+':5,'-':5,'*':6,'/':6,'%':6,'**':7};function primary(){const x=pop();if(x.v==='('){let e=expr(0);must(')');return e}if(x.v==='-'||x.v==='!'||x.v==='+')return{t:'unary',op:x.v,e:expr(8)};if(x.kind==='num')return{t:'lit',v:Number(x.v)};if(x.kind==='str'){let v=x.v[0]==='"'?JSON.parse(x.v):x.v.slice(1,-1).replace(/\\'/g,"'");return{t:'lit',v}}if(x.v==='true'||x.v==='false'||x.v==='null')return{t:'lit',v:x.v==='null'?null:x.v==='true'};if(x.kind==='id'){must('(');const args=[];if(peek()!==')'){do{args.push(expr(0));if(peek()!==',')break;pop()}while(true)}must(')');if(!['field','round','abs','coalesce','concat','min','max'].includes(x.v))throw Error(`不支持函数 ${x.v}`);return{t:'fn',name:x.v,args}}throw Error('表达式不完整或语法错误')}
function expr(min){let left=primary();while(true){if(peek()==='?'&&min<=0){pop();const yes=expr(0);must(':');const no=expr(0);left={t:'if',c:left,yes,no};continue}const op=peek(),bp=priority[op];if(bp===undefined||bp<min)break;pop();const right=expr(bp+(op==='**'?0:1));left={t:'binary',op,a:left,b:right}}return left}const out=expr(0);if(peek()!=='EOF')throw Error(`存在未解析内容：${peek()}`);return out}
function evaluate(ast,row){function val(n){if(n.t==='lit')return n.v;if(n.t==='unary'){const v=val(n.e);if(n.op==='!')return!v;if(v===null)return null;if(typeof v!=='number')throw Error('数值运算需要数字');return n.op==='-'?-v:v}if(n.t==='if')return val(n.c)?val(n.yes):val(n.no);if(n.t==='fn'){if(n.name==='field'){if(n.args.length!==1||n.args[0].t!=='lit'||typeof n.args[0].v!=='string')throw Error('field() 需要字段名称');if(!fields().includes(n.args[0].v))throw Error(`字段 ${n.args[0].v} 不存在`);return row[n.args[0].v]??null}if(n.name==='coalesce'){for(const a of n.args){const v=val(a);if(v!=null)return v}return null}const vs=n.args.map(val);if(n.name==='concat')return vs.map(v=>v??'').join('');if(vs.some(v=>v===null))return null;if(vs.some(v=>typeof v!=='number'))throw Error('函数参数需要数值');if(n.name==='round'){if(vs.length<1||vs.length>2)throw Error('round 参数数量错误');const d=vs[1]??0;if(!Number.isInteger(d)||d<0||d>12)throw Error('小数位需要 0～12');return Math.round(vs[0]*10**d)/10**d}if(n.name==='abs')return Math.abs(vs[0]);if(n.name==='min')return Math.min(...vs);if(n.name==='max')return Math.max(...vs)}if(n.t==='binary'){const a=val(n.a);if(n.op==='&&')return Boolean(a)&&Boolean(val(n.b));if(n.op==='||')return Boolean(a)||Boolean(val(n.b));const b=val(n.b);if(n.op==='===')return a===b;if(n.op==='!==')return a!==b;if(a===null||b===null)return null;if(['>','<','>=','<='].includes(n.op))return n.op==='>'?a>b:n.op==='<'?a<b:n.op==='>='?a>=b:a<=b;if(typeof a!=='number'||typeof b!=='number')throw Error('数值运算只接受数字');if((n.op==='/'||n.op==='%')&&b===0)throw Error('除数不能为 0');return n.op==='+'?a+b:n.op==='-'?a-b:n.op==='*'?a*b:n.op==='/'?a/b:n.op==='%'?a%b:a**b}throw Error('不支持的表达式')}const result=val(ast);if(typeof result==='number'&&!Number.isFinite(result))throw Error('结果不是有限数字');return result}
function checkType(v,type){if(v==null)return true;return typeof v===type}
function preview(){if(!dset[active].open)return;const s=$('scope').value,rs=scopeRows(),target=mode==='new'?$('newField').value.trim():$('existingField').value,typ=$('fieldType').value;const desc=s==='selected'?'使用地图与表格共享的选择集':s==='filtered'?'只计算图层过滤后的记录':s==='visible'?'包括表格搜索与图层过滤':'包含本图层全部要素';$('scopeDescription').innerHTML=`<strong>${rs.length} 条记录</strong><span>· ${desc}</span>`;let errors=[],results=[],fatal='';if(!target)fatal='请输入字段名称';else if(mode==='new'&&fields().includes(target))fatal='字段已存在，请切换到“更新已有字段”';else if(mode==='new'&&['id','__proto__','constructor'].includes(target))fatal='字段名称不可用';else if(rs.length===0)fatal='当前范围没有可计算的记录';else if(!$('expression').value.trim())fatal='请输入表达式';if(!fatal){try{const ast=parse($('expression').value);results=rs.map(r=>{try{const v=evaluate(ast,r);if(!checkType(v,typ))throw Error('计算结果与目标字段类型不一致');return{row:r,value:v,error:''}}catch(e){let err=String(e.message);errors.push({row:r,error:err});return{row:r,value:null,error:err}}})}catch(e){fatal=String(e.message)}}const first=results.slice(0,5),v=$('validation');if(fatal){v.textContent='表达式或目标字段需要修正：'+fatal;v.className='validation error'}else if(errors.length){v.textContent=`发现 ${errors.length} 条计算错误，本次不会提交任何修改`;v.className='validation error'}else{v.textContent='表达式有效 · 执行前将完整检查目标范围';v.className='validation'}$('previewStatus').textContent=`预览 ${Math.min(rs.length,5)} / ${rs.length} 条`;$('beforeCol').textContent=mode==='update'?'当前值':'字段示例';$('previewBody').innerHTML=first.length?first.map(r=>`<tr><td>${esc(r.row.名称)} <span style="color:#92a0a8">${esc(r.row.id)}</span></td><td>${esc(mode==='update'?r.row[target]??'—':r.row.流量??'—')}</td><td>${r.error?'—':esc(r.value??'NULL')}</td><td class="${r.error?'error':'ok'}">${r.error?'错误':'正常'}</td></tr>`).join(''):`<tr><td colspan="4" style="color:#8a959b">${esc(fatal||'无数据')}</td></tr>`;let list=$('errorList');if(errors.length){list.hidden=false;list.textContent=`首个错误：${errors[0].row.id} · ${errors[0].error}`;}else list.hidden=true;$('executeBtn').disabled=Boolean(fatal||errors.length);$('footStatus').textContent=errors.length?`存在 ${errors.length} 条错误，尚未修改任何数据`:fatal?'未准备好':`${mode==='new'?'新增字段':'覆盖字段'}「${target}」· ${rs.length} 条`;lastPreview=(!fatal&&!errors.length)?{rs,results,target,typ,mode}:null}
function execute(){preview();if(!lastPreview){toast('请先修正错误');return}const x=lastPreview;history.push(JSON.stringify(dset[active].rows));for(const r of x.results){r.row[x.target]=r.value}renderShell();refreshFields();preview();toast(`已计算 ${x.results.length} 条记录（模拟），可通过 Ctrl+Z 撤销`)}
const exprExamples={round:'round(field("流量") / 1000, 2)',class:'field("流量") >= 1000 ? "主要河流" : "一般河流"',concat:'concat(field("名称"), "-河流")',error:'field("流量") / (field("等级") - 1)'};const exprTypes={round:'number',class:'string',concat:'string',error:'number'};function example(){let k=$('example').value;$('expression').value=exprExamples[k];if(mode==='new')$('fieldType').value=exprTypes[k];preview()}
function show(){if(!dset[active].open){dset.rivers.open=true;active='rivers';renderShell();refreshFields()}$('calculator').hidden=false;$('closed').classList.remove('show');$('calculator').style.left='50%';$('calculator').style.top='50%';$('calculator').style.transform='translate(-50%,-50%)';preview();$('expression').focus()}function hide(){$('calculator').hidden=true;$('closed').classList.add('show');$('reopen').focus()}
$('modeNew').onclick=()=>setMode('new');$('modeUpdate').onclick=()=>setMode('update');$('newField').oninput=preview;$('existingField').onchange=()=>{$('fieldType').value=typeOf($('existingField').value);preview()};$('fieldType').onchange=preview;$('scope').onchange=preview;$('expression').oninput=preview;$('example').onchange=example;$('fieldsTab').onclick=()=>{assistMode='fields';$('fieldsTab').classList.add('on');$('funcTab').classList.remove('on');renderAssist()};$('funcTab').onclick=()=>{assistMode='func';$('funcTab').classList.add('on');$('fieldsTab').classList.remove('on');renderAssist()};$('assistSearch').oninput=renderAssist;$('tableSearch').oninput=()=>{renderShell();preview()};$('executeBtn').onclick=execute;$('calcClose').onclick=hide;$('cancelBtn').onclick=hide;$('reopen').onclick=show;$('reopenCenter').onclick=show;
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&history.length&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='INPUT'){e.preventDefault();dset[active].rows=JSON.parse(history.pop());renderShell();refreshFields();preview();toast('已撤销模拟计算')}if(e.key==='Escape'&&!$('calculator').hidden)hide()});
const h=$('dragHeader');h.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const box=$('calculator').getBoundingClientRect();$('calculator').style.transform='none';$('calculator').style.left=box.left+'px';$('calculator').style.top=box.top+'px';drag={x:e.clientX,y:e.clientY,left:box.left,top:box.top};h.setPointerCapture(e.pointerId)});h.addEventListener('pointermove',e=>{if(!drag)return;const el=$('calculator'),maxX=window.innerWidth-el.offsetWidth,maxY=window.innerHeight-el.offsetHeight;el.style.left=Math.max(0,Math.min(maxX,drag.left+e.clientX-drag.x))+'px';el.style.top=Math.max(0,Math.min(maxY,drag.top+e.clientY-drag.y))+'px'});h.addEventListener('pointerup',()=>drag=null);h.addEventListener('pointercancel',()=>drag=null);
renderShell();refreshFields();example();
})();
