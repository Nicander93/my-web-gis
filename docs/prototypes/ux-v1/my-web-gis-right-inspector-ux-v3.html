/* Integrated inspector: dense data-oriented panels; low-frequency settings stay collapsed. */
.navtabs button:hover:not(.active){background:#f1f5f6;color:#3d5966}
.ins-section{padding:9px 12px;border-bottom:1px solid #e6ebed}
.ins-section--tight{padding:7px 12px}
.ins-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ins-top:last-child{margin-bottom:0}
.ins-top strong{font-size:12px;font-weight:600}
.ins-data{display:grid;grid-template-columns:75px minmax(0,1fr);column-gap:10px;row-gap:8px;align-items:center}
.ins-data dt{color:var(--secondary);min-width:0}
.ins-data dd{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-data dd[title]{cursor:help}
.ins-input{height:26px;border:1px solid #cbd5d9;border-radius:3px;padding:0 7px;background:#fff;width:100%;min-width:0}
.ins-input--number{max-width:76px;text-align:right}
.ins-control{display:flex;align-items:center;gap:8px;min-width:0}
.ins-control--end{justify-content:flex-end}
.ins-check{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.ins-check input{accent-color:var(--accent);width:13px;height:13px}
.ins-range{flex:1;min-width:0;accent-color:var(--accent);height:18px}
.ins-range-value{min-width:35px;text-align:right;font-variant-numeric:tabular-nums;color:#3b515e}
.ins-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ins-actions.compact{gap:12px}
.ins-actions button.txtlink{white-space:nowrap}
.ins-small{font-size:11px;color:#7b878d}
.ins-feature-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.ins-feature-table td{padding:6px 7px;border-bottom:1px solid #edf0f1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-feature-table tr:last-child td{border-bottom:0}
.ins-feature-table td:first-child{width:38%;color:#6a7980}
.ins-feature-table td:nth-child(2){user-select:text}
.ins-pill{display:inline-flex;align-items:center;border:1px solid #d7e5e9;border-radius:3px;background:#f0f6f8;padding:2px 6px;font-size:11px;color:#376981}
.ins-preview{height:43px;background:#f7f9f9;border:1px solid #e0e6e8;display:grid;place-items:center;overflow:hidden;white-space:nowrap;margin-top:9px}
.ins-minihead{font-size:11px;color:#718189;margin-bottom:5px}
.ins-divider{height:1px;background:#edf0f1;margin:9px 0}
.ins-advanced{padding:0;border:0}
.ins-advanced summary{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;list-style:none;color:#46616e}
.ins-advanced summary::-webkit-details-marker{display:none}
.ins-advanced summary::after{content:'⌄';font-size:13px;color:#75838c}
.ins-advanced[open] summary::after{content:'⌃'}
.ins-advanced__body{padding:0 12px 12px}
.ins-mutedbox{background:#f8f9f9;border:1px solid #e2e7e9;padding:7px 8px;color:#65747b;font-size:11px}
.ins-result-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ins-button-tool{height:24px;padding:0 8px;background:#fff;border:1px solid #d3dce0;border-radius:3px}
.ins-button-tool:hover{background:#f0f6f8}
.ins-button-tool:disabled{opacity:.3}
.ins-empty{padding:30px 14px;text-align:center;color:#72838b}
.ins-tabswitch{display:flex;gap:4px;align-items:center}
.ins-stats{display:flex;gap:12px;justify-content:space-between;border-bottom:1px solid #edf0f1;padding-bottom:7px}
.ins-stats span{color:#73838a}
.ins-stats strong{font-weight:600;color:#304854}
.ins-focus{color:#2d6b89}
@media(max-width:480px){#panel{width:100%;height:100dvh}.ins-actions{gap:5px}}

function classSection(s){if(s.mode==='single')return '';const rows=(s.classes||[]).map((c,i)=>`<button class="trow ${s.sel===i?'current':''}" data-sel="${i}" title="编辑 ${esc(c.name)} 符号"><span><span class="micro-line" style="--line-color:${c.color}"></span></span><span>${esc(c.name)}</span><span class="count">${c.count}</span></button>`).join('');return `<div class="segment slim"><div class="line2"><label for="classField">${s.mode==='graduated'?'分级字段':'分类字段'}</label><select class="formselect" id="classField"><option value="river_type" ${s.field==='river_type'?'selected':''}>river_type</option><option value="level" ${s.field==='level'?'selected':''}>level</option></select></div><div class="line2"><label for="ramp">色带</label><select class="formselect" id="ramp"><option value="blue" ${s.ramp==='blue'?'selected':''}>蓝色系列</option><option value="orange" ${s.ramp==='orange'?'selected':''}>暖色系列</option></select></div></div><div class="subhead"><span>${s.mode==='graduated'?'分级列表':'分类列表'}</span><small>${s.classes.length} 项</small></div><div class="segment slim"><div class="class-table"><div class="thead"><span>符号</span><span>类别</span><span style="text-align:right">数量</span></div>${rows}</div><div class="row between" style="margin-top:7px"><div class="row"><button class="button" data-action="add-class">＋ 添加</button><button class="button" data-action="reclass">重新分类</button></div><span class="muted">选择行以编辑</span></div></div>`}

function toast(text){$('toastRoot').innerHTML=`<div class="toast">${esc(text)}</div>`;setTimeout(()=>$('toastRoot').replaceChildren(),1900)}function menu(show=true){if(!show){$('menuRoot').innerHTML='';return}const p=document.querySelector('[data-action=more]').getBoundingClientRect();const x=Math.max(5,Math.min(innerWidth-198,p.right-191));const y=Math.min(innerHeight-160,p.bottom+3);$('menuRoot').innerHTML=`<div class="menu" id="themenu" style="left:${x}px;top:${y}px"><button data-action="preset-save">保存为个人符号…</button><div class="separator"></div><button data-action="sld">导出 SLD…</button><button data-action="publish">发布到 GeoServer…</button></div>`;}

 if(el.id==='labelOffset')update(()=>view().label.offset=Number(el.value));
 if(el.id==='mode'){const next=el.value;update(()=>{const s=view();s.mode=next;if(next!=='single'&&!s.classes){s.field='type';s.ramp='blue';s.sel=0;s.classes=[{name:'类别 A',value:'A',count:12,color:s.color,size:s.size||3},{name:'类别 B',value:'B',count:28,color:'#84b7cf',size:s.size||2}]}});return}
 if(el.id==='classField')update(()=>view().field=el.value);
 if(el.id==='ramp')update(()=>{const s=view();s.ramp=el.value;const arr=el.value==='blue'?['#217db3','#4397c7','#8cc6e3']:['#bb784a','#d99c6c','#f0cf98'];s.classes.forEach((x,i)=>x.color=arr[i%arr.length])});
 if(el.id==='primaryColor')update(()=>selectedObj().color=el.value);
 if(el.id==='strokeColor')update(()=>view().stroke=el.value);
 if(el.id==='size')update(()=>{const s=view(),x=Number(el.value);if(s.shape==='polygon')s.opacity=x;else selectedObj().size=x});
 if(el.id==='strokeWidth')update(()=>view().strokeWidth=Number(el.value));
 if(el.id==='opacity')update(()=>view().opacity=Number(el.value));
 if(el.dataset.rule!==undefined)update(()=>view().rules[Number(el.dataset.rule)].on=el.checked);
});
$('panel').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='layerName'){e.preventDefault();e.target.blur()}});
$('undo').onclick=()=>{const h=history.pop();if(!h)return;Object.keys(state).forEach(k=>state[k]=h.state[k]);dirty=h.dirty;render()};
$('menuRoot').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;menu(false);openDialog(el.dataset.action)});
document.addEventListener('click',e=>{if(!e.target.closest('.menu,.dots'))menu(false)});
$('modalRoot').addEventListener('click',e=>{if(e.target.classList?.contains('mask')||e.target.closest('[data-close]')){closeDialog();return}const choice=e.target.closest('[data-preset]');if(choice){const item=presets[view().shape][Number(choice.dataset.preset)];update(()=>{view().symbol=item[0];selectedObj().color=item[1]});closeDialog();toast('符号已应用');return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='rule-apply'){update(()=>{const name=$('ruleName').value.trim()||'重点要素强调';if(ruleEditIndex===null)view().rules.push({name,on:true});else view().rules[ruleEditIndex].name=name});closeDialog()}if(action==='zoom-apply'){update(()=>{view().zoom={from:Number($('zoomStart').value),to:Number($('zoomEnd').value)}});closeDialog();toast('Zoom 规则已设置')}});
$('modalRoot').addEventListener('change',e=>{const el=e.target;if(el.id==='editorColor')update(()=>selectedObj().color=el.value);if(el.id==='editorSize')update(()=>selectedObj().size=Number(el.value))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();menu(false)}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();dirty=false;render();toast('项目已保存（原型模拟）')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.matches('input,textarea')){$('undo').click()}});
render();
</script></body></html>
