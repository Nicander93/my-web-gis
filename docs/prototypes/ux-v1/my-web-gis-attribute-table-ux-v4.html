/* V2: data first, contextual controls instead of five primary toolbar buttons */
.toolbar-v2 { height:38px; min-height:38px; gap:10px; padding:4px 10px; }
.toolbar-v2 .search { width:278px; }
.toolbar-v2 .chip-toggle { margin-left:2px; color:#64747d; }
.toolbar-v2 .toolbar-more { padding:0 9px; height:26px; border-color:transparent; background:transparent; color:#566973; }
.toolbar-v2 .toolbar-more:hover { border-color:#cbd6dc; }
.toolbar-v2 .toolbar-right .menu { right:0; left:auto; min-width:176px; }
.table-footer { height:34px; min-height:34px; gap:9px; }
.table-footer .status-link { border:0; background:transparent; height:24px; padding:0 6px; color:#667985; border-radius:3px; font-size:11px; }
.table-footer .status-link:hover:not(:disabled) { background:#e9f2f6; color:#1e6b91; }
.table-footer .editing-on { color:#287959; font-weight:650; }
.footer-selection .menu { top:auto; bottom:calc(100% + 5px); }
.footer-divider { height:15px; border-left:1px solid #d6e0e5; }
.footer-hint { color:#9ba6ad; }
.table-footer #undoBtn:disabled { color:#b8c3c7; }
.table-footer .footer-page { margin-left:auto; }
table.data th.sortable { padding:0 7px 0 10px; }
table.data .column-title { display:inline-block; overflow:hidden; text-overflow:ellipsis; max-width:calc(100% - 24px); vertical-align:middle; }
table.data .column-menu-trigger { display:inline-flex; padding:0; height:21px; min-width:20px; width:20px; align-items:center; justify-content:center; border:0; background:transparent; color:#a8b4bb; vertical-align:middle; margin-left:2px; font-size:15px; }
table.data th:hover .column-menu-trigger,table.data .column-menu-trigger:focus-visible { color:#316f8e; background:#e1ecf2; }
.column-menu { position:fixed; top:100px; left:350px; z-index:25; width:186px; }
.column-menu-title { font-size:11px; font-weight:650; color:#6a7d88; padding:6px 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border-bottom:1px solid var(--subline); }
.filter-pill-btn { height:24px!important; cursor:pointer; }
.filterbar { min-height:30px; padding:3px 12px; }
.popover { top:35px; left:280px; }
@media (max-width:650px) { .toolbar-v2 .search { width:180px; min-width:110px; } .toolbar-v2 .chip-toggle { font-size:11px;} .footer-hint { display:none } .table-footer { gap:5px; padding:0 6px; } .popover{left:10px;max-width:calc(100vw - 50px)} }

/* V3: narrow desktop command strip; icon-only commands, data-first table */
.icon-sprite{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.toolbar-v3{height:38px;min-height:38px;padding:4px 9px;gap:6px;overflow:visible}
.toolbar-v3 .search{width:250px;min-width:130px;flex-shrink:1}
.toolbar-rule{height:18px;border-left:1px solid #dce4e8;margin:0 3px;flex-shrink:0}
.toolset,.toolbar-v3 .toolbar-right{display:flex;align-items:center;gap:2px}
.toolbar-v3 .toolbar-right{margin-left:auto}
.icon-tool{display:inline-flex;align-items:center;justify-content:center;gap:0;position:relative;flex:0 0 auto;height:27px;width:29px;min-width:29px;padding:0;border:1px solid transparent;background:transparent;border-radius:3px;color:#586a75}
.icon-tool:hover:not(:disabled){border-color:#cfdae0;background:#edf3f6;color:#265f7c}
.icon-tool:active:not(:disabled){background:#dfedf4}
.icon-tool--active,.icon-tool.editing-on{background:#e5f1f7;color:#216482;border-color:#bad5e3}
.icon-tool.editing-on{background:#e5f3ed;border-color:#bee1ce;color:#2c7852}
.icon-tool:disabled{opacity:.27}
.tool-icon{width:15px;height:15px;stroke:currentColor;stroke-width:1.85;stroke-linejoin:round;stroke-linecap:round;fill:none;pointer-events:none}
#moreBtn .tool-icon{fill:currentColor;stroke:none}
#selectBtn{width:37px}
.tool-chevron{width:11px;height:11px;stroke:currentColor;stroke-width:1.9;fill:none;pointer-events:none;margin-left:-1px;opacity:.65}
.tool-dot{display:none;position:absolute;right:3px;top:3px;width:4px;height:4px;border-radius:100%;background:#287196}
.icon-tool--active .tool-dot{display:block}
.toolbar-mode-label{font-size:11px;color:#819099;padding-right:3px}
.toolbar-mode-label:has(+ .editing-on){color:#2b7954;font-weight:650}
.toolbar-v3 .toolbar-right .menu{right:0;left:auto;min-width:190px}
.toolbar-v3 #selectMenu{min-width:176px;left:0;right:auto}
.toolbar-v3 .popover{top:35px;left:min(297px,calc(100vw - 415px));max-width:calc(100vw - 40px)}
.table-footer{height:32px;min-height:32px;gap:9px;padding:0 10px}
.footer-view-toggle{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer;font-size:11px;color:#5f7380}
.footer-view-toggle input{width:13px;height:13px;accent-color:#28698a;margin:0}
.footer-selected{font-size:11px;white-space:nowrap;color:#657984}
.footer-selected strong{color:#2b6888}
.footer-divider{height:14px}
.table-footer #selectedCount{margin-left:0}
@media(max-width:760px){.toolbar-v3 .search{width:175px;min-width:100px}.toolbar-v3{gap:4px}.toolbar-v3 .toolbar-right{gap:0}.toolbar-v3 .toolbar-mode-label{display:none}.toolbar-rule{margin:0 1px}.table-footer{gap:6px}.footer-view-toggle{font-size:11px}.toolbar-v3 .popover{left:10px}}
@media(max-width:530px){.toolbar-v3 .search{width:110px}.toolbar-v3 #undoBtn{display:none}.toolbar-v3 #calcBtn{display:none}.footer-hint{display:none}.table-footer #counter{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}


/* V4: compact, clearly scoped search/filter feedback. */
.tab-shell{display:flex;align-items:stretch;position:relative;flex-shrink:0;border-right:1px solid #e8edef}
.tab-shell .tab{padding:0 9px 0 13px;min-width:65px}
.tab-shell .tab.active:after{right:-22px}
.tab-close{display:flex;align-items:center;justify-content:center;align-self:center;border:0;border-radius:3px;background:transparent;color:#83909a;width:23px;height:23px;padding:0;font-size:16px;z-index:1}
.tab-close:hover{background:#e4edf2;color:#2a4f65;border:0}
.tab-open-anchor{position:relative;display:flex;align-items:center;flex-shrink:0}
.tab-plus{border:0;background:transparent;align-self:center;height:24px;width:26px;padding:0;font-size:18px;color:#677985}
.tab-plus:hover{background:#e9f2f5;border:0}
.tab-open-menu{top:calc(100% - 2px);min-width:165px}
.table-empty{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#84929a}
.table-empty strong{font-size:14px;font-weight:500;color:#596b74}
.filter-scope{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;color:#526774;font-size:12px}
.filter-scope>span{min-width:55px;color:#87949c}
.filter-scope label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.filter-scope input{width:13px;height:13px;accent-color:var(--primary);margin:0}
.filterbar{gap:5px;flex-wrap:wrap;padding:4px 11px;min-height:32px}
.filterbar .filter-pill{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;height:23px;padding:0 5px 0 8px;max-width:370px;background:#f3f7f9;color:#3a667c;border:1px solid #cbdce4}
.filterbar .filter-pill.layer-scope{background:#e8f3f7;color:#225f7c;border-color:#b6d5e2}
.filterbar .filter-pill.search-scope{background:#f7f8f9;color:#5d737f;border-color:#dfe6e9}
.filterbar .filter-pill .filter-pill-label{font-weight:600;flex-shrink:0}
.filterbar .filter-pill .pill-value{max-width:165px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filterbar .filter-pill .pill-close{height:19px;width:19px;padding:0;border:0;background:transparent;border-radius:2px;color:#8096a1;font-size:16px;line-height:1}
.filterbar .filter-pill .pill-close:hover{background:#dcebf2;color:#1e607e;border:0}
.filterbar .scope-indicator{font-size:11px;color:#82919a;margin-left:auto;white-space:nowrap}
#counter strong{color:#455e70}
@media(max-width:700px){.filterbar .scope-indicator{display:none}.filterbar .filter-pill .pill-value{max-width:90px}.tab-shell .tab{padding:0 6px}}
</style>

 function openColumnMenu(field,x,y){if(!data().fields.some(f=>f.name===field))return;closePop();columnMenuField=field;const node=$('columnMenu');node.innerHTML=`<div class="column-menu-title">${esc(field)}</div><button data-col-action="sort-asc">升序排列</button><button data-col-action="sort-desc">降序排列</button><hr><button data-col-action="filter-field">筛选此字段…</button><button data-col-action="field-calculator">计算此字段…</button><hr><button data-col-action="hide">隐藏此列</button><button data-col-action="columns">列显示…</button>`;node.hidden=false;node.style.left=Math.max(10,Math.min(x,innerWidth-205))+'px';node.style.top=Math.max(10,Math.min(y,innerHeight-280))+'px'}
 function renderColumns(){$('columnList').innerHTML=data().fields.map(f=>`<label style="display:flex;align-items:center;justify-content:space-between;height:29px;cursor:pointer"><span style="display:flex;align-items:center;gap:7px"><input style="height:14px;width:14px;accent-color:var(--primary)" type="checkbox" data-col="${esc(f.name)}" ${sess().hidden.has(f.name)?'':'checked'}>${esc(f.name)}</span><span style="color:#96a2a9;font-size:11px">${f.type==='number'?'数值':'文本'}</span></label>`).join('')}
 function closePop(){if(pop)setPop(pop)}
 function startEditCell(td){if(!editing){toast('当前为只读模式，请点击工具栏铅笔图标开启编辑');return}if(td.querySelector('input'))return;const field=td.dataset.field,id=td.dataset.id,r=data().rows.find(x=>x.__id===id),schema=data().fields.find(f=>f.name===field);if(!r||!schema)return;const old=r[field];const i=document.createElement('input');i.className='cell-editor';i.value=old??'';td.textContent='';td.append(i);i.focus();i.select();let committed=false;const save=()=>{if(committed)return;const raw=i.value;let result=raw;if(schema.type==='number'){if(raw.trim()===''){toast('数值字段不能输入空内容');i.focus();return}result=Number(raw);if(!Number.isFinite(result)){toast('请输入有效数值');i.focus();return}}if(result!==old){snapshot();r[field]=result;toast('字段已修改，可撤销')}committed=true;render()};i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save()}else if(e.key==='Escape'){committed=true;render()}else if(e.key==='Tab'){save()}});i.addEventListener('blur',()=>{if(!committed){if(schema.type==='number'&&!Number.isFinite(Number(i.value))){toast('数值无效，已取消本次修改');render()}else save()}})}
 // 仅为交互原型实现受限数值表达式；不使用 eval。
 function evaluate(expr,row){let text=expr.trim();if(!text)throw Error('请输入表达式');let match=/^round\s*\(\s*([\s\S]+?)\s*,\s*(\d+)\s*\)$/i.exec(text);if(match){const v=evaluate(match[1],row);if(typeof v!=='number')throw Error('round 只支持数值');const digits=Number(match[2]);if(digits>8)throw Error('保留小数位最多 8 位');return Number(v.toFixed(digits))}
  match=/^field\s*\(\s*["']([^"']+)["']\s*\)(?:\s*([+\-*/])\s*(-?\d+(?:\.\d+)?))?$/i.exec(text);if(match){const val=row[match[1]];if(val===undefined)throw Error('字段不存在：'+match[1]);if(!match[2])return val;if(typeof val!=='number')throw Error('字段不是数值：'+match[1]);const b=Number(match[3]);switch(match[2]){case '+':return val+b;case '-':return val-b;case '*':return val*b;case '/':if(b===0)throw Error('除数不能为零');return val/b}}
  if(/^[-+]?\d+(?:\.\d+)?$/.test(text))return Number(text);if(/^"[^"\n]*"$/.test(text))return text.slice(1,-1);
  throw Error('此原型仅演示 field("字段")、四则运算常数和 round(…, 位数)')}
 function calcTargets(){const s=sess();switch($('calcScope').value){case 'selected':return data().rows.filter(r=>s.selected.has(r.__id));case 'filtered':return getFilteredRows();case 'visible':return getRows();default:return data().rows}}
 function calcDraft(){const name=calcMode==='new'?$('targetNew').value.trim():$('targetExisting').value;const type=calcMode==='new'?$('targetType').value:data().fields.find(x=>x.name===name)?.type;return {name,type,scope:calcTargets(),expr:$('expression').value}}
 function validateCalc(){let draft=calcDraft();let err='';let results=[];if(!draft.name)err='请指定目标字段';else if(calcMode==='new'&&data().fields.some(x=>x.name===draft.name))err='字段已存在，请改用「更新已有字段」';else if(!draft.scope.length)err='当前计算范围没有记录';else{for(const row of draft.scope){try{const v=evaluate(draft.expr,row);if(v!==null&&typeof v!==draft.type)throw Error('计算结果与字段类型不一致');if(typeof v==='number'&&!Number.isFinite(v))throw Error('计算结果无效');results.push({row,value:v,ok:true})}catch(e){results.push({row,error:e.message,ok:false});if(!err)err=`记录 ${row.__id}：${e.message}`}}}
 return {draft,err,results}}
 function previewCalc(){const v=validateCalc();$('previewSummary').textContent=`目标记录：${v.draft.scope.length} 条`;let arr=v.results.slice(0,4);$('previewBody').innerHTML=arr.map(item=>`<tr><td>${esc(item.row['名称']??item.row.__id)}</td><td class="${item.ok?'':'err'}">${item.ok?esc(item.value??'NULL'):'—'}</td><td class="${item.ok?'':'err'}">${item.ok?'正常':esc(item.error)}</td></tr>`).join('')||'<tr><td colspan="3" style="color:#89969e">暂无预览</td></tr>';$('calcValidation').className=v.err?'error-message':'valid-message';$('calcValidation').textContent=v.err?v.err:'表达式有效，执行时将再次检查全部目标记录。';$('calcFootnote').textContent=calcMode==='new'?'新增字段将写入当前数据集':'将覆盖所选字段在目标记录中的值';$('calcExecute').disabled=!!v.err;$('calcExecute').textContent=editing?'执行计算':'进入编辑并计算';return v}
 function initCalc(){calcMode='new';$('calcLayer').textContent='当前图层：'+data().name;$('modeNew').classList.add('current');$('modeUpdate').classList.remove('current');$('targetNew').value='流量_千立方米';$('targetType').value='number';$('targetExisting').innerHTML=data().fields.map(f=>`<option value="${esc(f.name)}">${esc(f.name)}</option>`).join('');$('targetExisting').value=data().fields.find(f=>f.type==='number')?.name??data().fields[0].name;$('calcScope').value='all';$('expression').value=data().fields.some(x=>x.name==='流量')?'round(field("流量") / 1000, 2)':`field("${data().fields.find(x=>x.type==='number')?.name??data().fields[0].name}")`;$('helperFields').innerHTML=data().fields.map(f=>`<button data-expr='field(&quot;${esc(f.name)}&quot;)'>${esc(f.name)} <span style="float:right;color:#99a6af">${f.type==='number'?'数值':'文本'}</span></button>`).join('');refreshCalcMode();$('calcOverlay').classList.add('open')}
 function refreshCalcMode(){$('modeNew').classList.toggle('current',calcMode==='new');$('modeUpdate').classList.toggle('current',calcMode==='update');$('targetNew').hidden=calcMode==='update';$('targetExisting').hidden=calcMode!=='update';$('targetType').disabled=calcMode==='update';$('targetType').value=calcMode==='update'?data().fields.find(f=>f.name===$('targetExisting').value)?.type??'string':$('targetType').value;$('targetFieldLabel').textContent=calcMode==='new'?'新字段名称':'选择已有字段';previewCalc()}
 function insertExpr(str){const e=$('expression'),a=e.selectionStart,b=e.selectionEnd;e.value=e.value.slice(0,a)+str+e.value.slice(b);e.focus();e.setSelectionRange(a+str.length,a+str.length);previewCalc()}
 function openManager(){$('managerOverlay').classList.add('open');renderManager()}
 function renderManager(){$('addFieldBtn').disabled=!editing;$('managerList').innerHTML='<div class="manager-row head"><span>字段名称</span><span>类型</span><span>可空</span><span style="text-align:right">操作</span></div>'+data().fields.map(f=>`<div class="manager-row"><span class="ellipsis">${esc(f.name)}</span><span>${f.type==='number'?'数值':'文本'}</span><span>是</span><div class="actions"><button data-rename="${esc(f.name)}" ${editing?'':'disabled'}>重命名</button><button data-delete="${esc(f.name)}" ${editing?'':'disabled'}>删除</button></div></div>`).join('')}
 document.addEventListener('click',e=>{let target=e.target;if(!(target instanceof Element))return;
 let t=target.closest('[data-colmenu]');if(t){e.stopPropagation();let b=t.getBoundingClientRect();openColumnMenu(t.dataset.colmenu,b.left,b.bottom+4);return}
 t=target.closest('[data-col-action]');if(t){const action=t.dataset.colAction,field=columnMenuField;closeColumnMenu();if(!field)return;const s=sess();if(action==='sort-asc'||action==='sort-desc'){s.sort=field;s.asc=action==='sort-asc';s.page=1;render()}else if(action==='filter-field'){filterScope='table';filterRequestedField=field;setPop('filter')}else if(action==='field-calculator'){initCalc();calcMode='update';$('targetExisting').value=field;refreshCalcMode()}else if(action==='hide'){s.hidden.add(field);render()}else if(action==='columns'){setPop('columns')}return}
 if(!target.closest('#columnMenu'))closeColumnMenu();
 t=target.closest('[data-tab-close]');if(t){e.stopPropagation();const id=t.dataset.tabClose;openTabs=openTabs.filter(x=>x!==id);if(active===id)active=openTabs.at(-1)||'';closePop();render();return}
 t=target.closest('[data-open-tab]');if(t){const id=t.dataset.openTab;if(!openTabs.includes(id))openTabs.push(id);active=id;closePop();render();return}
 if(target.closest('#openTabBtn')){const menu=$('openTabMenu');menu.hidden=!menu.hidden;return}
 t=target.closest('[data-tab]');if(t){active=t.dataset.tab;closePop();render();return}t=target.closest('[data-action]');if(t){const cmd=t.dataset.action,s=sess(),rows=getRows();if(cmd==='select-visible'){rows.forEach(x=>s.selected.add(x.__id));toast(`已选择 ${rows.length} 条当前结果`)}if(cmd==='invert-selection'){rows.forEach(x=>s.selected.has(x.__id)?s.selected.delete(x.__id):s.selected.add(x.__id))}if(cmd==='clear-selection'){s.selected.clear();toast('已清除选择')}if(cmd==='columns'){pop=null;setPop('columns');return}if(cmd==='field-manager'){closePop();openManager();return}if(cmd==='field-calculator'){closePop();initCalc();return}if(cmd==='filter-global'){filterScope='layer';filterRequestedField=null;closePop();setPop('filter');return}closePop();render();return}t=target.closest('[data-close]');if(t){$(t.dataset.close==='calc'?'calcOverlay':'managerOverlay').classList.remove('open');return}
 t=target.closest('[data-sort]');if(t){let s=sess(),name=t.dataset.sort;if(s.sort===name)s.asc=!s.asc;else{s.sort=name;s.asc=true}s.page=1;render();return}t=target.closest('[data-check]');if(t){let s=sess(),id=t.dataset.check;t.checked?s.selected.add(id):s.selected.delete(id);render();return}if(target.id==='checkPage'){let s=sess(),p=paged();if(target.checked)p.rows.forEach(x=>s.selected.add(x.__id));else p.rows.forEach(x=>s.selected.delete(x.__id));render();return}t=target.closest('tr[data-id]');if(t && !target.closest('input,button')){const s=sess(),id=t.dataset.id;if(e.ctrlKey||e.metaKey){s.selected.has(id)?s.selected.delete(id):s.selected.add(id)}else{s.selected.clear();s.selected.add(id)}if(s.onlySelected)render();else refreshSelectionUi();return}
 if(target.id==='filterBtn'){filterRequestedField=null;setPop('filter');return}if(target.id==='calcBtn'){closePop();initCalc();return}if(target.id==='selectBtn'){setPop('selection');return}if(target.id==='moreBtn'){setPop('fields');return}t=target.closest('[data-open-filter]');if(t){filterScope=t.dataset.openFilter;filterRequestedField=null;closePop();setPop('filter');return}
 t=target.closest('[data-clear-filter]');if(t){if(t.dataset.clearFilter==='layer')sess().filter=null;else sess().tableFilter=null;sess().page=1;closePop();render();return}
 if(target.closest('[data-clear-search]')){sess().query='';sess().page=1;render();$('search').focus();return}
 if(target.id==='filterApply'){const f={field:$('filterField').value,op:$('filterOp').value,value:$('filterValue').value};if(filterScope==='layer')sess().filter=f;else sess().tableFilter=f;sess().page=1;closePop();render();toast(filterScope==='layer'?'图层筛选已应用：地图与属性表同步变化':'表格筛选已应用：地图不变');return}
 if(target.id==='filterClear'){if(filterScope==='layer')sess().filter=null;else sess().tableFilter=null;sess().page=1;closePop();render();return}if(target.id==='columnReset'){sess().hidden.clear();renderColumns();render();return}if(target.id==='editBtn'){editing=!editing;render();toast(editing?'已进入属性编辑模式':'已结束属性编辑；可在项目中保存修改');return}if(target.id==='undoBtn'){undoAction();return}if(target.id==='pagePrev'){sess().page=Math.max(1,sess().page-1);render();return}if(target.id==='pageNext'){sess().page=Math.min(paged().pages,sess().page+1);render();return}
 if(target.id==='modeNew'||target.id==='modeUpdate'){calcMode=target.id==='modeNew'?'new':'update';refreshCalcMode();return}if(target.id==='fillExample'){let f=data().fields.find(x=>x.type==='number');$('expression').value=f?`round(field("${f.name}") / 1000, 2)`:`field("${data().fields[0].name}")`;previewCalc();return}t=target.closest('[data-expr]');if(t){insertExpr(t.dataset.expr);return}if(target.id==='calcExecute'){const v=validateCalc();if(v.err){previewCalc();return}if(!editing)editing=true;snapshot();if(calcMode==='new'){data().fields.push({name:v.draft.name,type:v.draft.type});data().rows.forEach(r=>{r[v.draft.name]=null})}for(const item of v.results){const row=data().rows.find(x=>x.__id===item.row.__id);row[v.draft.name]=item.value} $('calcOverlay').classList.remove('open');render();toast(`计算完成：${v.results.length} 条记录，可一步撤销`);return}
 if(target.id==='addFieldBtn'){if(!editing)return;const name=prompt('新增字段名称');if(!name)return;const trimmed=name.trim();if(!trimmed||data().fields.some(f=>f.name===trimmed)){toast('字段名称无效或重复');return}snapshot();data().fields.push({name:trimmed,type:'string'});data().rows.forEach(x=>x[trimmed]='');renderManager();render();return}t=target.closest('[data-rename]');if(t){const old=t.dataset.rename;const name=prompt('重命名字段',old);if(!name||name===old)return;const n=name.trim();if(!n||data().fields.some(f=>f.name===n)){toast('字段名称无效或重复');return}snapshot();data().fields.find(f=>f.name===old).name=n;data().rows.forEach(r=>{r[n]=r[old];delete r[old]});renderManager();render();toast('演示：已修改数据字段（真实产品需检查样式引用）');return}t=target.closest('[data-delete]');if(t){const name=t.dataset.delete;if(!confirm(`删除字段「${name}」及全部记录中的数据？（原型演示）`))return;snapshot();data().fields=data().fields.filter(f=>f.name!==name);data().rows.forEach(r=>delete r[name]);renderManager();render();return}
 if(target.closest('.popover,.menu,.dropdown-anchor,#moreBtn,#selectBtn,.tab-open-anchor'))return;closePop();const tm=$('openTabMenu');if(tm)tm.hidden=true;});
 document.addEventListener('change',e=>{const t=e.target;if(!(t instanceof Element))return;if(t.matches('input[name=filterScope]')){refreshFilterScope();const f=filterScope==='layer'?sess().filter:sess().tableFilter;if(f){$('filterField').value=f.field;$('filterOp').value=f.op;$('filterValue').value=f.value}else{$('filterOp').value='contains';$('filterValue').value=''}return}if(t.id==='onlySelected'){sess().onlySelected=t.checked;sess().page=1;render();return}if(t.matches('[data-col]')){const f=t.dataset.col;t.checked?sess().hidden.delete(f):sess().hidden.add(f);render();return}if(t.closest('#calcOverlay')){if(t.id==='targetExisting')$('targetType').value=data().fields.find(f=>f.name===t.value)?.type??'string';previewCalc()}});
 $('search').addEventListener('input',e=>{sess().query=e.target.value;sess().page=1;render()}); // Restore focus for continuous typing
 $('search').addEventListener('focus',()=>{});
 $('calcOverlay').addEventListener('input',e=>{if(e.target.matches('input,textarea'))previewCalc()});
 $('thead').addEventListener('contextmenu',e=>{const cell=e.target.closest('[data-sort]');if(cell){e.preventDefault();openColumnMenu(cell.dataset.sort,e.clientX,e.clientY)}});
 $('tbody').addEventListener('dblclick',e=>{const td=e.target.closest('td[data-field]');if(td){e.stopPropagation();startEditCell(td)}});
 $('tbody').addEventListener('keydown',e=>{if(e.key==='Enter' && e.target.matches('td[data-field]')){e.preventDefault();startEditCell(e.target)}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('openTabMenu'))$('openTabMenu').hidden=true;if($('calcOverlay').classList.contains('open')){$('calcOverlay').classList.remove('open');return}if($('managerOverlay').classList.contains('open')){$('managerOverlay').classList.remove('open');return}closePop()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.closest('input,textarea')){e.preventDefault();undoAction()}});
 render();
})();
</script>
