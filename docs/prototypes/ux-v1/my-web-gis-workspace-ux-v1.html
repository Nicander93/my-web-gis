function renderAttr(){const keys=Object.keys(records);$('#attrTabs').innerHTML=keys.map(id=>`<button class="attr-tab ${state.table===id?'active':''}" data-table="${id}">${esc(layers.find(l=>l.id===id).name)} <span style="font-weight:400;color:#91a0a8;margin-left:4px">×</span></button>`).join('')+'<span class="attr-meta"><span id="attrCount"></span></span>';const query=$('#tableSearch').value.trim().toLowerCase();const base=records[state.table],visible=base.filter((r,j)=>(!state.onlySelected||state.selectedRows.has(j))&&(!query||r.some(v=>String(v).toLowerCase().includes(query))));$('#attrCount').textContent=`${visible.length} / ${base.length} 条`;$('#attrTable').innerHTML=`<thead><tr><th style="width:35px">#</th>${columns[state.table].map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${visible.map((r,k)=>{const index=base.indexOf(r);return `<tr data-row="${index}" class="${state.selectedRows.has(index)?'selected':''}"><td>${index+1}</td>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`}).join('')}</tbody>`;$('#selectionStatus').textContent=`选中 ${state.selectedRows.size}`;}
function setTable(id){state.table=id;state.selectedRows.clear();renderAttr();renderInspector()}
function renderTasks(){const rows=tasks.map((t,i)=>({...t,i})).filter(t=>state.taskFilter==='all'||t.status===state.taskFilter);$('#taskRows').innerHTML=rows.map(t=>`<tr data-task="${t.i}" class="${t.i===state.selectedTask?'active':''}"><td>${esc(t.name)}${t.progress&&t.status==='running'?`<div style="height:3px;background:#e4ecee;margin-top:5px;width:95%;border-radius:5px"><div style="width:${t.progress}%;background:#5899b4;height:100%"></div></div>`:''}</td><td><span class="status-text ${t.status}">${t.status==='running'?'进行中':t.status==='done'?'已完成':t.status==='fail'?'失败':'已取消'}</span></td><td class="num">${t.time}</td><td>${t.status==='running'?'<button class="text-btn" data-cancel="'+t.i+'">取消</button>':''}</td></tr>`).join('');const t=tasks[state.selectedTask];$('#taskDetail').innerHTML=t?`<span>${esc(t.detail)}</span><span class="status-text ${t.status}">${t.status==='running'?'进行中 '+t.progress+'%':t.status==='done'?'已完成':'需检查'}</span>`:'<span>选择任务查看详情</span>';$('#taskStatus').textContent=tasks.some(t=>t.status==='running')?'1 运行中':'无进行中';$('#taskDot').className='dot '+(tasks.some(t=>t.status==='running')?'':'');}
function openFloat(id){const el=$('#'+id);el.classList.add('show');$$('.floating').forEach(x=>x.style.zIndex=x===el?'42':'35');if(id==='tasksWindow')renderTasks()}
function openModal(mode){if(mode==='sld'||mode==='publish'||mode==='export'||mode==='about'||mode==='add-layer'){window.alert(({sld:'原型聚焦工作区 UX；SLD 导出将在独立发布流程中处理。',publish:'发布到 GeoServer 将在独立向导中处理。',export:'导出图层将在单独窗口中处理。',about:'my-web-gis · 工作区 UX 讨论原型。', 'add-layer':'添加图层：使用正式项目的添加数据流程。'})[mode]);return}$('#modalScrim').classList.add('show');state.modalMode=mode;$('#modalTitle').textContent=mode==='editor'?'编辑符号':'选择符号';$('#modalPickerLayout').style.display=mode==='editor'?'none':'flex';$('#modalEditorLayout').style.display=mode==='editor'?'flex':'none';$('#modalCancel').textContent=mode==='editor'?'关闭':'取消';$('#modalConfirm').style.display=mode==='editor'?'none':'inline-block';const cat=label().type;state.category=cat==='raster'?'all':cat;state.preset=Math.max(0,presets.findIndex(p=>p.cat===state.category));if(mode==='editor')renderEditorModal();else renderPresets();}
function renderEditorModal(){const l=label(),typ=l.type,parts=typ==='line'&&l.id==='roads'?['道路外描边','道路内部线']:typ==='line'?['基础线']:typ==='polygon'?['填充层','边界线']:['圆形标记'];state.editorSelected=Math.min(state.editorSelected,parts.length-1);const part=parts[state.editorSelected];const c=state.themeColor;const symbol=typ==='point'?`<circle cx="103" cy="40" r="${Math.min(27,state.pointSize+7)}" fill="${c}" stroke="white" stroke-width="3"/>`:typ==='line'?`<path d="M20 55 Q95 10 190 40" fill="none" stroke="${typ==='line'&&l.id==='roads'?'#576e7b':c}" stroke-width="15" stroke-linecap="round"/><path d="M20 55 Q95 10 190 40" fill="none" stroke="${l.id==='roads'?'#efcc91':c}" stroke-width="${l.id==='roads'?Math.min(13,state.roadWidth+4):Math.min(12,state.riverWidth+2)}" stroke-linecap="round"/>`:`<rect x="66" y="15" width="80" height="50" fill="${c}" stroke="#7594a1" stroke-width="2"/>`;
$('#modalEditorLayout').innerHTML=`<aside class="modal-aside" style="width:218px;border-right:1px solid #d9e0e3"><div style="font-size:11px;color:#7c878d;margin:2px 8px 9px">符号图层</div>${parts.map((name,i)=>`<button data-elayer="${i}" class="${state.editorSelected===i?'active':''}" style="margin-bottom:3px">${name}</button>`).join('')}<div style="padding:12px 9px;border-top:1px solid #e6ebed;margin-top:15px;color:#84919a;font-size:11px">按顺序组合绘制</div></aside><main class="modal-content" style="padding:18px 22px"><div class="section-label">符号预览</div><div style="height:88px;display:flex;align-items:center;justify-content:center;background:#f8fafb;border:1px solid #e1e8eb;margin-bottom:17px"><svg width="240" height="80" viewBox="0 0 210 80">${symbol}</svg></div><div class="section-label">${part}</div><div style="display:grid;grid-template-columns:100px minmax(120px,230px);gap:10px;align-items:center;margin-top:10px"><label for="editorColor">颜色</label><input id="editorColor" type="color" value="${c}" style="height:27px;border:1px solid #ccd6db;background:white;width:80px"><label for="editorSize">${typ==='point'?'直径':typ==='line'?'线宽':'透明度'}</label><input id="editorSize" class="control" type="number" min="1" max="${typ==='polygon'?100:40}" value="${typ==='point'?state.pointSize:typ==='line'?l.id==='roads'?state.roadWidth:state.riverWidth:100}"><label>参数模式</label><select class="control" id="editorMode"><option>固定值</option><option>按 Zoom 变化</option><option>按属性字段</option></select></div><div style="margin-top:25px;border-top:1px solid #e7edef;padding-top:12px"><button class="text-btn" data-act="editor-dynamic">动态属性设置…</button></div></main>`;
}
function renderPresets(){const cs=[['all','全部'],['point','点符号'],['line','线符号'],['polygon','面符号']];$('#modalCategories').innerHTML=cs.map(([c,l])=>`<button data-cat="${c}" class="${state.category===c?'active':''}">${l}</button>`).join('');const q=$('#symbolSearch').value.trim();const data=presets.map((p,i)=>({...p,i})).filter(p=>(state.category==='all'||p.cat===state.category)&&(!q||p.name.includes(q)));$('#symbolGrid').innerHTML=data.map(p=>{const svg=p.cat==='point'?`<svg width="65" height="27"><${p.square?'rect':'circle'} ${p.square?'x="26" y="7" width="14" height="14"':'cx="33" cy="14" r="8"'} fill="${p.outline?'white':p.color}" stroke="${p.color}" stroke-width="2"/></svg>`:p.cat==='line'?`<svg width="65" height="27"><path d="M3 18Q22 2 62 15" stroke="${p.double?'#66747a':p.color}" stroke-width="${p.double?10:5}" fill="none"/><path d="M3 18Q22 2 62 15" stroke="${p.double?p.color:'white'}" stroke-width="${p.double?6:1}" ${p.dash?'stroke-dasharray="5 4"':''} fill="none"/></svg>`:`<svg width="65" height="27"><rect x="13" y="4" width="41" height="19" fill="${p.color}" stroke="#85999c"/></svg>`;return `<button class="preset ${state.preset===p.i?'active':''}" data-preset="${p.i}"><span class="preset-preview">${svg}</span><span>${p.name}</span></button>`}).join('')}
function applyPreset(){const p=presets[state.preset];if(!p)return;pushUndo();state.themeColor=p.color;state.pointSize=p.size;markDirty();renderInspector();refreshMap();$('#modalScrim').classList.remove('show')}
function closeMenus(){$$('.menu-pop').forEach(x=>x.classList.remove('open'));$$('[data-menu]').forEach(x=>x.setAttribute('aria-expanded','false'));}
function action(a){closeMenus();if(a==='tasks')return openFloat('tasksWindow');if(a==='diagnostics')return openFloat('diagnosticsWindow');if(a==='close-tasks')return $('#tasksWindow').classList.remove('show');if(a==='close-diagnostics')return $('#diagnosticsWindow').classList.remove('show');if(a==='attributes'){state.tableOpen=!state.tableOpen;$('#attr').classList.toggle('collapsed',!state.tableOpen);$('#attrState').textContent=state.tableOpen?'已打开':'已收起';return}if(a==='hide-attr'){state.tableOpen=false;$('#attr').classList.add('collapsed');$('#attrState').textContent='已收起';return}if(a==='save'){state.dirty=false;$('#projectName').textContent='流域调查 · 已保存';$('#diagnosticSaveState').textContent='已保存';return}if(a==='undo')return undo();if(a==='redo')return redo();if(a==='library'||a==='editor')return openModal(a);if(a==='editor-dynamic'){window.alert('动态属性编辑将沿用此前确定的 Zoom 节点弹窗；本原型聚焦工作区布局。');return}if(a==='close-modal')return $('#modalScrim').classList.remove('show');if(a==='apply-symbol')return applyPreset();if(a==='zoom-in'||a==='zoom-out'||a==='zoom-home'){state.zoom=a==='zoom-home'?11:Math.min(19,Math.max(3,state.zoom+(a==='zoom-in'?1:-1)));refreshMap();return}if(a==='table-clear'){state.selectedRows.clear();renderAttr();return}if(a==='filter-selection'){state.onlySelected=!state.onlySelected;document.querySelector('[data-act="filter-selection"]').style.background=state.onlySelected?'#e3f0f7':'';renderAttr();return}if(a==='locate-points'){selectLayer('points');$('#diagnosticsWindow').classList.remove('show');return}if(a==='locate-imagery'){selectLayer('imagery');$('#diagnosticsWindow').classList.remove('show');return}if(a==='refresh-diagnostics')return;if(a==='copy-report'){const s='my-web-gis 诊断：水文站点缺少坐标；影像服务连接超时';navigator.clipboard?.writeText(s).then(()=>{$('[data-act="copy-report"]').textContent='已复制'}).catch(()=>{$('[data-act="copy-report"]').textContent='复制失败'});return}if(a==='clear-tasks'){for(let i=tasks.length-1;i>=0;i--)if(tasks[i].status!=='running')tasks.splice(i,1);state.selectedTask=0;renderTasks();return}if(a==='tool-default'){return}if(a==='reset'){document.documentElement.style.setProperty('--left','246px');document.documentElement.style.setProperty('--right','290px');document.documentElement.style.setProperty('--table','203px');return}if(a==='layer-menu'){document.querySelector('[data-menu="layer"]').click();return}openModal(a)}
function renderRibbon(){const r={map:['浏览','选择','测量','|','添加图层','属性表','图层属性'],data:['添加图层','属性表','筛选记录','导出图层…'],edit:['选择','编辑要素','撤销','重做'],analysis:['缓冲区','空间叠加','任务中心'],view:['属性表','任务中心','诊断中心','重置布局']};const map={'添加图层':'add-layer','属性表':'attributes','任务中心':'tasks','诊断中心':'diagnostics','重置布局':'reset','撤销':'undo','重做':'redo','导出图层…':'export','图层属性':'editor'};$('#ribbonTools').innerHTML=r[state.ribbon].map((v,i)=>v==='|'?'<span class="tool-sep"></span>':`<button class="tool ${i===0?'selected':''}" data-tool="${v}" data-act="${map[v]||'tool-default'}">${v}</button>`).join('')}
function bindEvents(){document.addEventListener('click',e=>{const menu=e.target.closest('[data-menu]');if(menu){const key=menu.dataset.menu,pop=$('#menu-'+key),open=pop.classList.contains('open');closeMenus();pop.classList.toggle('open',!open);menu.setAttribute('aria-expanded',String(!open));return}const act=e.target.closest('[data-act]');if(act){action(act.dataset.act);return}const tab=e.target.closest('[data-itab]');if(tab){state.tab=tab.dataset.itab;renderInspector();return}const rub=e.target.closest('[data-ribbon]');if(rub){state.ribbon=rub.dataset.ribbon;$$('.ribbon-tab').forEach(x=>x.classList.toggle('active',x===rub));renderRibbon();return}const check=e.target.closest('[data-check]');if(check){const l=layers.find(x=>x.id===check.dataset.check);l.visible=check.checked;renderLayers();renderMapVisibility();return}const layer=e.target.closest('[data-layer]');if(layer){selectLayer(layer.dataset.layer);return}const row=e.target.closest('[data-row]');if(row){const idx=Number(row.dataset.row);if(state.selectedRows.has(idx))state.selectedRows.delete(idx);else state.selectedRows.add(idx);renderAttr();renderInspector();return}const tb=e.target.closest('[data-table]');if(tb){setTable(tb.dataset.table);return}const t=e.target.closest('[data-task]');if(t){state.selectedTask=Number(t.dataset.task);renderTasks();return}const cancel=e.target.closest('[data-cancel]');if(cancel){e.stopPropagation();const t=tasks[Number(cancel.dataset.cancel)];t.status='cancelled';t.detail='任务已取消。';renderTasks();return}const cat=e.target.closest('[data-cat]');if(cat){state.category=cat.dataset.cat;renderPresets();return}const pre=e.target.closest('[data-preset]');if(pre){state.preset=Number(pre.dataset.preset);renderPresets();return}const ep=e.target.closest('[data-elayer]');if(ep){state.editorSelected=Number(ep.dataset.elayer);renderEditorModal();return}if(!e.target.closest('.menu-pop'))closeMenus()});$('#targetSelect').addEventListener('change',e=>selectLayer(e.target.value));$('#layerSearch').addEventListener('input',renderLayers);$('#tableSearch').addEventListener('input',renderAttr);$('#taskFilter').addEventListener('change',e=>{state.taskFilter=e.target.value;renderTasks()});$('#symbolSearch').addEventListener('input',renderPresets);$('#modalEditorLayout').addEventListener('change',e=>{if(e.target.id==='editorColor'){pushUndo();state.themeColor=e.target.value;markDirty();renderEditorModal();renderInspector();refreshMap()}if(e.target.id==='editorSize'){pushUndo();const l=label();if(l.type==='point')state.pointSize=Number(e.target.value)||12;else if(l.id==='roads')state.roadWidth=Number(e.target.value)||5;else if(l.type==='line')state.riverWidth=Number(e.target.value)||3;markDirty();renderEditorModal();renderInspector();refreshMap()}if(e.target.id==='editorMode'&&e.target.value!=='固定值'){action('editor-dynamic');e.target.value='固定值'}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#modalScrim').classList.remove('show');closeMenus();return}if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();action('save')}if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.target.matches('input')){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='a'){e.preventDefault();action('attributes')}});$('#modalScrim').addEventListener('click',e=>{if(e.target===$('#modalScrim'))action('close-modal')});for(const head of $$('.float-head')){let pt;head.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const host=head.parentElement;const rect=host.getBoundingClientRect();pt={x:e.clientX,y:e.clientY,left:rect.left,top:rect.top};head.setPointerCapture(e.pointerId)});head.addEventListener('pointermove',e=>{if(!pt)return;const host=head.parentElement;host.style.left=Math.max(8,Math.min(innerWidth-host.offsetWidth-8,pt.left+e.clientX-pt.x))+'px';host.style.top=Math.max(45,Math.min(innerHeight-host.offsetHeight-35,pt.top+e.clientY-pt.y))+'px'});head.addEventListener('pointerup',()=>pt=null);head.addEventListener('pointercancel',()=>pt=null)}$$('[data-resize]').forEach(el=>{let pos;el.addEventListener('pointerdown',e=>{pos={x:e.clientX,y:e.clientY,left:parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--left'))||246,right:parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--right'))||290,table:parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--table'))||203};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!pos)return;const kind=el.dataset.resize;const val=kind==='left'?Math.max(178,Math.min(340,pos.left+e.clientX-pos.x)):kind==='right'?Math.max(220,Math.min(400,pos.right-(e.clientX-pos.x))):Math.max(112,Math.min(340,pos.table-(e.clientY-pos.y)));document.documentElement.style.setProperty('--'+kind, val+'px')});el.addEventListener('pointerup',()=>pos=null);el.addEventListener('pointercancel',()=>pos=null)})}
renderLayers();renderTarget();renderInspector();renderAttr();renderRibbon();renderMapVisibility();refreshMap();renderTasks();bindEvents();
</script></body></html>
