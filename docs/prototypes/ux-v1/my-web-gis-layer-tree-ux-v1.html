<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>my-web-gis | 图层树 UX V1</title>
<style>
:root{color-scheme:light;--bg:#f5f7f5;--surface:#fff;--edge:#dce2dc;--edge2:#ebefea;--fg:#29342d;--muted:#768179;--accent:#326b5e;--select:#e2efe6;--hover:#f1f5f1;--control:27px;font:12px/1.45 'Segoe UI','Microsoft YaHei UI',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(100deg,#dfe7e0,#f7f9f7);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:36px 14px;color:var(--fg)}button,input{font:inherit}button{border:0;background:transparent;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.shell{display:flex;flex-direction:column;width:330px;min-height:650px;max-height:calc(100vh - 65px);background:var(--surface);border:1px solid #cbd7cc;box-shadow:0 9px 32px #293a2b18}.title{display:flex;align-items:center;padding:0 10px;justify-content:space-between;height:32px;border-bottom:1px solid var(--edge);background:#fafbfa;font-weight:600;font-size:12px}.title-right{display:flex;gap:1px}.tool{width:25px;height:25px;border-radius:3px;display:grid;place-items:center;font-size:15px;color:#526157}.tool:hover,.tool.active{background:var(--hover)}.search{padding:7px 8px;border-bottom:1px solid var(--edge2);display:none}.search.visible{display:block}.search input{height:27px;width:100%;border:1px solid var(--edge);outline:none;border-radius:3px;padding:0 8px;color:var(--fg)}.section{display:flex;align-items:center;justify-content:space-between;padding:7px 9px 4px;color:var(--muted);font-size:11px}.tree{flex:1;overflow:auto;padding:2px 4px 12px}.row{display:flex;min-height:28px;align-items:center;gap:4px;margin:1px 0;border-radius:3px;cursor:default;user-select:none;padding:0 4px}.row:hover{background:var(--hover)}.row.selected{background:var(--select)}.row[draggable=true]{cursor:grab}.tree-switch{width:16px;min-width:16px;text-align:center;color:#58695b;font-size:11px;padding:0;line-height:24px}.checkbox{appearance:none;width:13px;height:13px;min-width:13px;background:#fff;border:1px solid #a5b4a8;border-radius:2px;margin:0 4px 0 0;cursor:pointer;position:relative}.checkbox:checked{background:var(--accent);border-color:var(--accent)}.checkbox:checked:after{content:'✓';color:#fff;position:absolute;font-size:11px;top:-3px;left:1px}.glyph{width:18px;flex:0 0 18px;height:14px;display:grid;place-items:center}.glyph.line:before{content:'';height:0;width:16px;border-top:4px solid #5999d1;border-radius:3px}.glyph.road:before{content:"";width:16px;border-top:5px solid #e0b26e;box-shadow:0 -1.5px #787d7a,0 1.5px #787d7a}.glyph.fill:before{content:'';width:14px;height:11px;background:#c3ddba;border:1px solid #8eaf86}.glyph.point:before{content:'';width:8px;height:8px;background:#437a93;border:2px solid #fff;box-shadow:0 0 0 1px #437a93;border-radius:50%}.glyph.boundary:before{content:'';width:16px;border-top:2px dashed #936eab}.glyph.folder{font-size:14px;color:#7b8e7a}.name{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.small{font-size:10px;color:var(--muted)}.tag{border:1px solid #95bea7;color:#286248;padding:0 3px;border-radius:2px;font-size:10px;line-height:15px}.more{width:20px;height:22px;border-radius:3px;display:grid;place-items:center;font-size:16px;color:#89928b;opacity:0}.row:hover .more,.row.selected .more,.more:focus-visible{opacity:1}.more:hover{background:#dce9df;color:#224b3a}.children{margin-left:20px;border-left:1px solid var(--edge2);padding-left:2px}.legend{padding:1px 0 4px 49px;color:#657168;display:none}.legend.open{display:block}.legend-item{display:flex;align-items:center;height:22px;gap:8px}.legend-line{width:21px;border-top:3px solid #5999d1}.legend-line.minor{border-top:2px solid #a8d1e8}.legend-fill{width:15px;height:12px;background:#c3ddba;border:1px solid #8eaf86}.legend-fill.forest{background:#a9c59a}.bottom{height:30px;border-top:1px solid var(--edge);color:var(--muted);padding:0 9px;display:flex;align-items:center;justify-content:space-between;font-size:11px}.popup{position:fixed;display:none;z-index:20;width:192px;max-height:80vh;overflow:auto;padding:4px;border:1px solid #cdd8d0;background:#fff;box-shadow:0 12px 32px #25352b2b;border-radius:4px}.popup.visible{display:block}.popup button{display:block;width:100%;height:27px;padding:0 10px;text-align:left;border-radius:3px}.popup button:hover{background:var(--hover)}.popup hr{border:0;border-top:1px solid var(--edge2);margin:4px 2px}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2b4537;color:#fff;border-radius:4px;padding:7px 12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}@media(max-width:480px){body{padding:10px}.shell{width:100%;max-height:calc(100vh - 20px)}}
</style></head><body>
<main class="shell" aria-label="图层面板">
<header class="title"><span>图层</span><div class="title-right"><button id="searchToggle" class="tool" aria-label="搜索图层" title="搜索图层">⌕</button><button id="addGroup" class="tool" aria-label="新建图层组" title="新建图层组">＋</button><button id="collapseAll" class="tool" aria-label="折叠全部" title="折叠全部">▤</button></div></header>
<div class="search" id="searchBox"><input id="searchInput" placeholder="搜索图层或组…" aria-label="搜索图层或组"></div>
<div class="section"><span>当前工程</span><span id="counter">6 个图层</span></div>
<section class="tree" id="tree">
 <div class="group" data-group="base"><div class="row group-row" data-group-row="base"><button class="tree-switch" data-expand="base" aria-label="展开或折叠基础底图">▾</button><input class="checkbox" type="checkbox" aria-label="显示基础底图" checked><span class="glyph folder">▱</span><span class="name"><b>基础底图</b></span><span class="small">2</span><button class="more" data-menu="base" data-kind="group" title="组操作" aria-label="基础底图组操作">⋯</button></div><div class="children" id="group-base">
  <div class="row layer-row" data-id="boundary" ><button class="tree-switch" data-expand="boundary" aria-label="展开行政边界图例">▸</button><input class="checkbox" type="checkbox" aria-label="显示行政边界" checked><span class="glyph boundary"></span><span class="name">行政区边界</span><button class="more" data-menu="boundary" data-kind="layer" aria-label="行政区边界操作">⋯</button></div><div class="legend" id="legend-boundary"><div class="legend-item"><span class="legend-line"></span>市界 / 县界</div></div>
  <div class="row layer-row" data-id="water" ><button class="tree-switch" data-expand="water" aria-label="展开水域图例">▸</button><input class="checkbox" type="checkbox" aria-label="显示水域" checked><span class="glyph fill"></span><span class="name">湖泊与水库</span><button class="more" data-menu="water" data-kind="layer" aria-label="湖泊与水库操作">⋯</button></div><div class="legend" id="legend-water"><div class="legend-item"><span class="legend-fill"></span>水域</div></div>
 </div></div>
 <div class="group" data-group="theme"><div class="row group-row" data-group-row="theme"><button class="tree-switch" data-expand="theme" aria-label="展开或折叠专题数据">▾</button><input class="checkbox" type="checkbox" aria-label="显示专题数据" checked><span class="glyph folder">▱</span><span class="name"><b>专题数据</b></span><span class="small">4</span><button class="more" data-menu="theme" data-kind="group" title="组操作">⋯</button></div><div class="children" id="group-theme">
  <div class="row layer-row selected" data-id="river" ><button class="tree-switch" data-expand="river" aria-label="展开河流水系图例">▾</button><input class="checkbox" type="checkbox" aria-label="显示河流水系" checked><span class="glyph line"></span><span class="name">河流水系</span><span class="tag" title="当前编辑图层">编辑</span><button class="more" data-menu="river" data-kind="layer" aria-label="河流水系操作">⋯</button></div><div class="legend open" id="legend-river"><div class="legend-item"><span class="legend-line"></span>主要河流</div><div class="legend-item"><span class="legend-line minor"></span>其他河流</div></div>
  <div class="row layer-row" data-id="road" ><button class="tree-switch" data-expand="road" aria-label="展开道路图例">▸</button><input class="checkbox" type="checkbox" aria-label="显示道路" checked><span class="glyph road"></span><span class="name">道路交通</span><button class="more" data-menu="road" data-kind="layer" aria-label="道路交通操作">⋯</button></div><div class="legend" id="legend-road"><div class="legend-item"><span class="legend-line" style="border-color:#e0b26e;border-width:5px"></span>主干道</div><div class="legend-item"><span class="legend-line minor" style="border-color:#9da8a6"></span>支路</div></div>
  <div class="row layer-row" data-id="station" ><button class="tree-switch" data-expand="station" aria-label="展开水文站点图例">▸</button><input class="checkbox" type="checkbox" aria-label="显示水文站点" checked><span class="glyph point"></span><span class="name">水文站点</span><span class="small">24</span><button class="more" data-menu="station" data-kind="layer" aria-label="水文站点操作">⋯</button></div><div class="legend" id="legend-station"><div class="legend-item"><span class="glyph point"></span>监测站</div></div>
  <div class="row layer-row" data-id="land" ><button class="tree-switch" data-expand="land" aria-label="展开土地利用图例">▸</button><input class="checkbox" type="checkbox" aria-label="显示土地利用" checked><span class="glyph fill"></span><span class="name">土地利用</span><button class="more" data-menu="land" data-kind="layer" aria-label="土地利用操作">⋯</button></div><div class="legend" id="legend-land"><div class="legend-item"><span class="legend-fill forest"></span>林地</div><div class="legend-item"><span class="legend-fill"></span>草地</div></div>
 </div></div>
</section>
<footer class="bottom"><span id="selectedStatus">已选图层：河流水系</span><span>右键查看操作</span></footer>
</main>
<div class="popup" id="popup" role="menu" aria-label="图层操作"></div><div class="toast" role="status" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)]; let current='river', toastTimer, targetId='',targetKind='';const toast=s=>{let n=$('#toast');n.textContent=s;n.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),2200)};
function select(row){$$('.layer-row').forEach(x=>x.classList.toggle('selected',x===row));current=row.dataset.id;$('#selectedStatus').textContent='已选图层：'+row.querySelector('.name').textContent.trim();}
$('#tree').addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.expand){let id=b.dataset.expand;const isGroup=!!$('#group-'+id);const node=$('#'+(isGroup?'group-':'legend-')+id);if(node){if(isGroup){node.hidden=!node.hidden;b.textContent=node.hidden?'▸':'▾'}else{node.classList.toggle('open');b.textContent=node.classList.contains('open')?'▾':'▸'}}return;}if(b?.dataset.menu){showMenu(e,b.dataset.menu,b.dataset.kind);return}const row=e.target.closest('.layer-row');if(row&&!e.target.matches('.checkbox'))select(row)});
$('#tree').addEventListener('contextmenu',e=>{const row=e.target.closest('.layer-row,.group-row');if(!row)return;e.preventDefault();const id=row.dataset.id||row.dataset.groupRow;showMenu(e,id,row.classList.contains('group-row')?'group':'layer')});
$$('.checkbox').forEach(c=>c.addEventListener('change',e=>{e.stopPropagation();const row=c.closest('.row');row.style.opacity=c.checked?1:.50;if(row.classList.contains('group-row')){const group=row.dataset.groupRow;$$('#group-'+group+' .checkbox').forEach(k=>{k.checked=c.checked;k.closest('.row').style.opacity=c.checked?1:.50})}}));
function showMenu(e,id,kind){targetId=id;targetKind=kind;const popup=$('#popup');let items=kind==='layer'?[['定位到图层','zoom'],['图层属性','props'],['编辑样式','style'],['编辑标注','label'],['打开属性表','table'],['---',''],['导出图层','export'],['发布到 GeoServer…','publish'],['---',''],['重命名','rename'],['向上移动','up'],['向下移动','down'],['移除图层','remove']]:[['新建子组','group'],['重命名组','rename'],['上移','up'],['下移','down'],['---',''],['移除组','remove']];popup.innerHTML=items.map(([name,cmd])=>name==='---'?'<hr>':`<button role="menuitem" data-cmd="${cmd}">${name}</button>`).join('');popup.classList.add('visible');let rect=e.target.getBoundingClientRect();let x=e.clientX??rect.right,y=e.clientY??rect.bottom;const w=195;popup.style.left=Math.max(4,Math.min(x,innerWidth-w-7))+'px';popup.style.top=Math.max(4,Math.min(y,innerHeight-Math.min(460,popup.offsetHeight)-10))+'px';}
$('#popup').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let cmd=b.dataset.cmd;$('#popup').classList.remove('visible');const row=targetKind==='layer'?document.querySelector(`.layer-row[data-id="${targetId}"]`):document.querySelector(`.group-row[data-group-row="${targetId}"]`);if(!row)return;if(cmd==='rename'){let old=row.querySelector('.name').textContent.trim();let name=prompt('名称',old);if(name?.trim()){row.querySelector('.name').textContent=name.trim();toast('已重命名')};return}if(cmd==='remove'){if(confirm(`从项目中移除${row.querySelector('.name').textContent.trim()}？`)){(row.closest('.group')&&targetKind==='group'?row.closest('.group'):row).remove();toast('已从图层树中移除（原型模拟）')}return}if(cmd==='up'||cmd==='down'){let mover=targetKind==='group'?row.closest('.group'):row;const sibling=cmd==='up'?mover.previousElementSibling:mover.nextElementSibling;if(sibling){if(cmd==='up')mover.parentElement.insertBefore(mover,sibling);else mover.parentElement.insertBefore(sibling,mover);toast('顺序已调整')}return}if(cmd==='group'){toast('原型：新增子组可在正式版本中执行');return}toast({zoom:'定位图层',props:'打开图层属性',style:'切到样式面板',label:'切到标注面板',table:'打开属性表',export:'导出图层',publish:'打开 GeoServer 发布向导'}[cmd]+'（原型）')});
document.addEventListener('click',e=>{if(!e.target.closest('#popup,.more'))$('#popup').classList.remove('visible')});
$('#searchToggle').onclick=()=>{$('#searchBox').classList.toggle('visible');if($('#searchBox').classList.contains('visible'))$('#searchInput').focus();else{$('#searchInput').value='';filter('')}};
$('#searchInput').oninput=e=>filter(e.target.value);
function filter(term){const t=term.toLowerCase();$$('.layer-row').forEach(row=>row.style.display=row.querySelector('.name').textContent.toLowerCase().includes(t)?'flex':'none');$$('.group').forEach(group=>{const own=group.querySelector('.group-row .name').textContent.toLowerCase().includes(t);const matched=$$('.layer-row').filter(x=>group.contains(x)&&x.style.display!=='none').length;group.style.display=own||matched||!t?'':'none';if(own)group.querySelectorAll('.layer-row').forEach(r=>r.style.display='flex');if(t&&group.style.display!=='none'){let children=group.querySelector('.children');children.hidden=false;group.querySelector('[data-expand]').textContent='▾'}})}
$('#addGroup').onclick=()=>toast('新建图层组（此原型不更改项目）');$('#collapseAll').onclick=()=>{$$('.children').forEach(x=>x.hidden=true);$$('.group-row [data-expand]').forEach(x=>x.textContent='▸')};
</script></body></html>
