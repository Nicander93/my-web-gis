#fff;cursor:pointer}.hex{font:11px Consolas,monospace;color:#57666d}.param-label{color:var(--secondary);margin-bottom:4px}.symbol-card{display:flex;gap:10px;align-items:center}.symbol-thumbnail{width:69px;height:57px;border:1px solid #d5dcdf;border-radius:3px;background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}.symbol-thumbnail:hover{border-color:var(--accent)}.symbol-line{width:53px;height:9px;display:block;position:relative}.symbol-line::after{content:"";display:block;position:absolute;inset:3px 0;background:var(--symbol-color,#2882bb);height:3px}.symbol-symbol{width:20px;height:20px;border-radius:50%;background:var(--symbol-color,#5a95b5);border:3px solid var(--symbol-stroke,#fff);outline:1px solid #c7d0d3}.symbol-polygon{width:45px;height:32px;background:var(--symbol-color,#c6dcbf);border:2px solid var(--symbol-stroke,#88ad88);clip-path:polygon(13% 14%,75% 3%,94% 34%,75% 89%,17% 93%,5% 57%)}.symbolmeta{display:flex;flex-direction:column;gap:4px;min-width:0}.symbolmeta .title{font-weight:600}.inline-actions{display:flex;gap:13px}.class-table{border:1px solid var(--border);border-radius:3px;overflow:hidden}.class-table .thead,.class-table .trow{display:grid;grid-template-columns:66px 1fr 44px;gap:0;align-items:center}.class-table .thead{font-size:11px;color:#7b898e;background:#f7f9f9;height:25px;border-bottom:1px solid #e2e7e9}.class-table .thead span,.class-table .trow>span{padding:0 9px}.class-table .trow{width:100%;border:0;border-bottom:1px solid #edf0f1;background:#fff;height:31px;text-align:left}.class-table .trow:last-child{border-bottom:0}.class-table .trow:hover{background:#f2f7fa}.class-table .trow.current{background:#e8f3f9}.class-table .count{text-align:right;color:#7d8990}.micro-line{display:inline-block;vertical-align:middle;width:39px;height:3px;border-radius:2px;background:var(--line-color)}.class-table .tools{display:flex;align-items:center;gap:8px;padding:7px;border-top:1px solid #edf0f1}.subhead{padding:7px 12px;background:# </style></head><body><div id="panel">
 <header class="bar"><span>图层属性</span><div class="bar-actions"><button class="iconbtn" id="undo" title="撤销上一步样式修改" aria-label="撤销">↶</button><button class="iconbtn" title="窗口停靠（示意）" aria-label="停靠" disabled>▣</button><button class="iconbtn" title="关闭（仅原型）" aria-label="关闭">×</button></div></header>

<script>
const init={points:{name:'水文站点',shape:'point',mode:'single',size:12,color:'#5599b5',stroke:'#ffffff',strokeWidth:2,opacity:100,symbol:'圆形标记',extra:false,rules:[]},rivers:{name:'河流水系',shape:'line',mode:'categorized',field:'river_type',ramp:'blue',color:'#237fb4',size:2.5,opacity:100,symbol:'简单双线',sel:0,classes:[{name:'主要河道',value:'main',count:42,color:'#217db3',size:3},{name:'一级支流',value:'primary',count:133,color:'#4397c7',size:2},{name:'二级支流',value:'secondary',count:524,color:'#8cc6e3',size:1}],rules:[{name:'重点河道加粗',on:true}]},areas:{name:'水库范围',shape:'polygon',mode:'single',color:'#c6dcbf',stroke:'#779f8c',strokeWidth:1,opacity:90,symbol:'基础面填充',extra:false,rules:[]}};
const state=structuredClone(init),history=[];let target='points',dirty=false,expanded=false,modal=null,menus=false,ruleEditIndex=null;const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function view(){return state[target]}function snapshot(){history.push({state:structuredClone(state),dirty});if(history.length>50)history.shift()}function update(fn){snapshot();fn();dirty=true;render()}function status(){ $('status').innerHTML=`<i class="badge ${dirty?'':'saved'}"></i>${dirty?'项目未保存':'已保存'}`;$('undo').disabled=history.length===0}function miniSymbol(a,cls=''){if(a.shape==='point')return `<span class="symbol-symbol ${cls}" style="--symbol-color:${esc(a.color)};--symbol-stroke:${esc(a.stroke||'#fff')}"></span>`;if(a.shape==='polygon')return `<span class="symbol-polygon ${cls}" style="--symbol-color:${esc(a.color)};--symbol-stroke:${esc(a.stroke||'#88ad88')}"></span>`;return `<span class="symbol-line ${cls}" style="--symbol-color:${esc(a.color)}"></span>`}function defaultSymbol(){const s=view(),sel=s.mode==='single'?s:s.classes?.[s.sel||0]||s;return {...sel,shape:s.shape,stroke:sel.stroke||s.stroke||'#fff'}}function modeTitle(mode){return {single:'单一符号',categorized:'分类渲染',graduated:'分级渲染'}[mode]||'单一符号'}function controls(s){const a=defaultSymbol(),isPoint=s.shape==='point',isLine=s.shape==='line',isPoly=s.shape==='polygon';return `<div class="segment"><div class="headingbar"><span class="heading">符号</span><button class="txtlink" data-action="edit-symbol">编辑符号…</button></div><div class="symbol-card"><button class="symbol-thumbnail" data-action="pick-symbol" title="选择其他符号">${miniSymbol(a)}</button><div class="symbolmeta"><span class="title">${esc(s.symbol)}</span><span class="muted">${isPoint?'填充 · 描边':isPoly?'填充 · 边界':'颜色 · 线宽'}</span><div class="inline-actions"><button class="txtlink" data-action="pick-symbol">更换符号</button></div></div></div></div><div class="segment"><div class="headingbar"><span class="heading">常用参数</span></div><div class="control-row"><div><div class="param-label">${isLine?'线颜色':'填充色'}</div><div class="colorcontrol"><input id="primaryColor" type="color" value="${a.color}" aria-label="${isLine?'线颜色':'填充色'}"><span class="hex" id="primaryHex">${a.color.toUpperCase()}</span></div></div><div><div class="param-label">${isPoint?'大小':isLine?'线宽':'透明度'}</div><div class="field-unit"><input id="size" class="smallfield" type="number" min="${isLine?0.1:1}" max="100" step="${isLine?0.5:1}" value="${isPoly?s.opacity:a.size??s.size??12}" aria-label="${isPoint?'大小':isLine?'线宽':'透明度'}"><span class="unit">${isPoly?'%':'px'}</span></div></div>${!isLine?`<div><div class="param-label">描边颜色</div><div class="colorcontrol"><input id="strokeColor" type="color" value="${esc(s.stroke||'#ffffff')}" aria-label="描边颜色"><span class="hex">${(s.stroke||'#ffffff').toUpperCase()}</span></div></div><div><div class="param-label">描边宽度</div><div class="field-unit"><input id="strokeWidth" class="smallfield" type="number" min="0" max="24" step="0.5" value="${s.strokeWidth??1}" aria-label="描边宽度"><span class="unit">px</span></div></div>`:`<div><div class="param-label">透明度</div><div class="field-unit"><input id="opacity" class="smallfield" type="number" min="0" max="100" step="5" value="${s.opacity}"><span class="unit">%</span></div></div><div><div class="param-label">线宽规则</div><button class="button" data-action="zoom">${s.zoom?'Zoom · 2 节点':'随 Zoom…'}</button></div>`}</div></div>`}
function classSection(s){if(s.mode==='single')return '';const rows=(s.classes||[]).map((c,i)=>`<button class="trow ${s.sel===i?'current':''}" data-sel="${i}" title="编辑 ${esc(c.name)} 符号"><span><span class="micro-line" style="--line-color:${c.color}"></span></span><span>${esc(c.name)}</span><span class="count">${c.count}</span></button>`).join('');return `<div class="segment slim"><div class="line2"><label for="classField">${s.mode==='graduated'?'分级字段':'分类字段'}</label><select class="formselect" id="classField"><option value="river_type" ${s.field==='river_type'?'selected':''}>river_type</option><option value="level" ${s.field==='level'?'selected':''}>level</option></select></div><div class="line2"><label for="ramp">色带</label><select class="formselect" id="ramp"><option value="blue" ${s.ramp==='blue'?'selected':''}>蓝色系列</option><option value="orange" ${s.ramp==='orange'?'selected':''}>暖色系列</option></select></div></div><div class="subhead"><span>${s.mode==='graduated'?'分级列表':'分类列表'}</span><small>${s.classes.length} 项</small></div><div class="segment slim"><div class="class-table"><div class="thead"><span>符号</span><span>类别</span><span style="text-align:right">数量</span></div>${rows}</div><div class="row between" style="margin-top:7px"><div class="row"><button class="button" data-action="add-class">＋ 添加</button><button class="button" data-action="reclass">重新分类</button></div><span class="muted">选择行以编辑</span></div></div>`}
function rulesSection(s){return `<div class="subhead"><span>附加规则</span><button class="txtlink" data-action="add-rule">＋ 添加</button></div><div class="segment slim">${s.rules.length?s.rules.map((r,i)=>`<div class="rule-row"><input type="checkbox" class="toggle" data-rule="${i}" ${r.on?'checked':''} aria-label="${esc(r.name)}"><span class="ruleinfo">${esc(r.name)}</span><button class="txtlink" data-action="rule-edit" data-id="${i}">设置…</button></div>`).join(''):'<span class="muted">无附加规则</span>'}</div>`}
function render(){const s=view();$('target').value=target;status(); $('content').innerHTML=`<div class="segment slim"><div class="row"><label for="mode" style="min-width:56px">主渲染</label><select class="formselect" id="mode" style="flex:1"><option value="single" ${s.mode==='single'?'selected':''}>单一符号</option><option value="categorized" ${s.mode==='categorized'?'selected':''}>分类渲染</option><option value="graduated" ${s.mode==='graduated'?'selected':''}>分级渲染</option></select><div class="menuanchor"><button class="dots" data-action="more" title="样式操作" aria-label="样式操作">⋯</button></div></div></div>${classSection(s)}${controls(s)}${s.shape==='line'?`<div class="segment slim"><button class="collapse" data-action="expand">线型、端点及其他参数 <span>${expanded?'⌃':'⌄'}</span></button>${expanded?`<div class="line2" style="margin-top:9px"><label>线型</label><select class="formselect" id="dash"><option>实线</option><option>虚线</option></select></div><div class="line2"><label>端点</label><select class="formselect"><option>圆角</option><option>平头</option></select></div>`:''}</div>`:''}${rulesSection(s)}`;}
function toast(text){$('toastRoot').innerHTML=`<div class="toast">${esc(text)}</div>`;setTimeout(()=>$('toastRoot').replaceChildren(),1900)}function menu(show=true){if(!show){$('menuRoot').innerHTML='';return}const p=document.querySelector('[data-action=more]').getBoundingClientRect();const x=Math.max(5,Math.min(innerWidth-198,p.right-191));const y=Math.min(innerHeight-160,p.bottom+3);$('menuRoot').innerHTML=`<div class="menu" id="themenu" style="left:${x}px;top:${y}px"><button data-action="preset-save">保存为个人符号…</button><div class="separator"></div><button data-action="sld">导出 SLD…</button><button data-action="publish">发布到 GeoServer…</button></div>`;}
const presets={point:[['圆形标记','#5599b5'],['深蓝测站','#2f6798'],['橙色站点','#d49a57'],['红色告警','#c76156'],['绿色站点','#669c7d'],['灰色站点','#929fa6']],line:[['简单蓝线','#217db3'],['主干河道','#4096c7'],['深蓝线','#30648f'],['行政边界','#9b729d'],['道路轮廓','#bd9b6f'],['绿色管线','#65a17b']],polygon:[['水域','#b4d9ee'],['林地','#c3ddbc'],['农田','#e3ddb2'],['工业','#cac9d5'],['城区','#d9d7d0'],['保护区','#cae0d8']]};
function openDialog(type){modal=type;const s=view();let body='',foot='';if(type==='library'){body=`<div class="row between"><span class="heading">系统符号 · ${s.shape==='point'?'点':s.shape==='line'?'线':'面'}</span><input class="field" style="width:190px" placeholder="搜索符号" id="presetSearch" aria-label="搜索符号"></div><div class="pickergrid" id="presetGrid">${presets[s.shape].map((p,i)=>`<button class="preset ${i===0?'selected':''}" data-preset="${i}">${miniSymbol({shape:s.shape,color:p[1],stroke:s.stroke})}<span>${p[0]}</span></button>`).join('')}</div>`;foot='<button class="button" data-close>关闭</button>'}else if(type==='editor'){body=`<div class="layeredit"><aside class="editlist"><strong>符号图层</strong><div class="item active">${s.shape==='line'?'基本线':'基础符号'}</div>${s.shape==='line'?'<div class="item">外描边（示意）</div>':''}</aside><div class="editprops"><div class="headingbar"><strong>符号属性</strong></div><div class="line2"><label>类型</label><span>${s.shape==='line'?'简单线':s.shape==='point'?'圆形标记':'面填充'}</span></div><div class="line2"><label>颜色</label><input type="color" class="field" style="width:100px;height:30px;padding:2px" id="editorColor" value="${defaultSymbol().color}"></div><div class="line2"><label>${s.shape==='line'?'线宽':'尺寸'}</label><input class="smallfield" type="number" id="editorSize" min="1" value="${defaultSymbol().size||s.size||2}"></div></div></div>`;foot='<button class="button" data-close>关闭</button>'}else if(type==='zoom'){body=`<div class="line2"><label>变化方式</label><select class="formselect" id="zoomKind"><option>线性插值</option><option>阶梯变化</option></select></div><div class="line2" style="margin-top:8px"><label>Z8</label><input type="number" id="zoomStart" class="smallfield" value="1" min="0.1" step="0.5"></div><div class="line2" style="margin-top:8px"><label>Z16</label><input type="number" id="zoomEnd" class="smallfield" value="5" min="0.1" step="0.5"></div>`;foot='<button class="button" data-close>取消</button><button class="button primary" data-action="zoom-apply">确定</button>'}else if(type==='rule'){body=`<div class="line2"><label>规则名称</label><input class="field" id="ruleName" value="${esc(ruleEditIndex===null?'重点要素强调':s.rules[ruleEditIndex]?.name||'重点要素强调')}"></div><div class="line2" style="margin-top:10px"><label>作用条件</label><select class="formselect"><option>重点字段为 true</option><option>所有要素</option></select></div>`;foot='<button class="button" data-close>取消</button><button class="button primary" data-action="rule-apply">确定</button>'}else{body=`<div style="padding:10px">${type==='sld'?'SLD 导出':type==='publish'?'GeoServer 发布':'符号另存为'}在完整应用中通过独立流程完成，此原型仅展示入口位置。</div>`;foot='<button class="button" data-close>关闭</button>'} const title={library:'选择符号',editor:'编辑符号',zoom:'线宽随 Zoom 变化',rule:ruleEditIndex===null?'新增附加规则':'编辑附加规则',sld:'导出 SLD',publish:'发布到 GeoServer','preset-save':'保存为符号'}[type];$('modalRoot').innerHTML=`<div class="mask"><div class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><header><span>${title}</span><button class="iconbtn" data-close>×</button></header><div class="dialogmain">${body}</div><div class="dialogfoot">${foot}</div></div></div>`;}
function closeDialog(){modal=null;$('modalRoot').innerHTML=''}function selectedObj(){const s=view();return s.mode==='single'?s:s.classes[s.sel]}
$('panel').addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-sel]');if(!el)return;if(el.dataset.sel!==undefined){view().sel=Number(el.dataset.sel);render();return}const a=el.dataset.action;if(a==='more'){menu();return}if(a==='expand'){expanded=!expanded;render();return}if(a==='edit-symbol')openDialog('editor');if(a==='pick-symbol')openDialog('library');if(a==='zoom')openDialog('zoom');if(a==='add-rule'){ruleEditIndex=null;openDialog('rule');}if(a==='rule-edit'){ruleEditIndex=Number(el.dataset.id);openDialog('rule');}if(a==='add-class')update(()=>{const s=view();s.classes.push({name:'新增类别',value:'new',count:0,color:'#879fae',size:2});s.sel=s.classes.length-1});if(a==='reclass')toast('类别已刷新（示例）');});
$('panel').addEventListener('change',e=>{const el=e.target;if(el.id==='target'){target=el.value;expanded=false;render();return}if(el.id==='mode'){const next=el.value;update(()=>{const s=view();s.mode=next;if(next!=='single'&&!s.classes){s.field='type';s.ramp='blue';s.sel=0;s.classes=[{name:'类别 A',value:'A',count:12,color:s.color,size:s.size||3},{name:'类别 B',value:'B',count:28,color:'#84b7cf',size:s.size||2}]} });return}if(el.id==='classField')update(()=>view().field=el.value);if(el.id==='ramp')update(()=>{const s=view();s.ramp=el.value;const arr=el.value==='blue'?['#217db3','#4397c7','#8cc6e3']:['#bb784a','#d99c6c','#f0cf98'];s.classes.forEach((x,i)=>x.color=arr[i%arr.length])});if(el.id==='primaryColor')update(()=>{selectedObj().color=el.value});if(el.id==='strokeColor')update(()=>view().stroke=el.value);if(el.id==='size')update(()=>{const s=view(),x=Number(el.value);if(s.shape==='polygon')s.opacity=x;else selectedObj().size=x});if(el.id==='strokeWidth')update(()=>view().strokeWidth=Number(el.value));if(el.id==='opacity')update(()=>view().opacity=Number(el.value));if(el.dataset.rule!==undefined)update(()=>view().rules[Number(el.dataset.rule)].on=el.checked);});
$('undo').onclick=()=>{const h=history.pop();if(!h)return;Object.keys(state).forEach(k=>state[k]=h.state[k]);dirty=h.dirty;render()};$('menuRoot').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;menu(false);openDialog(el.dataset.action)});document.addEventListener('click',e=>{if(!e.target.closest('.menu,.dots'))menu(false)});
$('modalRoot').addEventListener('click',e=>{if(e.target.classList?.contains('mask')||e.target.closest('[data-close]')){closeDialog();return}const choice=e.target.closest('[data-preset]');if(choice){const item=presets[view().shape][Number(choice.dataset.preset)];update(()=>{view().symbol=item[0];selectedObj().color=item[1]});closeDialog();toast('符号已应用');return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='rule-apply'){update(()=>{const name=$('ruleName').value.trim()||'重点要素强调';if(ruleEditIndex===null)view().rules.push({name,on:true});else view().rules[ruleEditIndex].name=name});closeDialog()}if(action==='zoom-apply'){update(()=>{view().zoom={from:Number($('zoomStart').value),to:Number($('zoomEnd').value)}});closeDialog();toast('Zoom 规则已设置')} });$('modalRoot').addEventListener('change',e=>{const el=e.target;if(el.id==='editorColor')update(()=>selectedObj().color=el.value);if(el.id==='editorSize')update(()=>selectedObj().size=Number(el.value))});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();menu(false)}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();dirty=false;render();toast('项目已保存（原型模拟）')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.matches('input,textarea')){$('undo').click()}});render();
</script></body></html>
