/* V2: the permanent right tool-window rail is the only primary switcher. */
:root{--rail:42px}
.work{position:relative;}
.right{width:322px;flex-shrink:0;transition:width .16s ease;border-left:1px solid var(--border);overflow:hidden;}
.right.closed{width:0!important;border-left:0!important;}
.right .pane-head{height:32px;}
.right .pane-head b{white-space:nowrap;}
.right .right-view{display:none;min-height:0;flex:1;flex-direction:column;}
.right .right-view.active{display:flex;}
.right-rail{width:var(--rail);flex:0 0 var(--rail);background:#f3f6f3;border-left:1px solid #cad6ce;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:6px 3px;z-index:3;}
.rail-button{width:35px;height:59px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#64766d;background:none;border:1px solid transparent;border-radius:4px;padding:4px 1px;position:relative;}
.rail-button:hover{background:#e9f1eb;color:#2a624f;}
.rail-button[aria-pressed="true"]{color:#145c48;background:#fff;border-color:#cfdfd4;box-shadow:0 1px 3px #143c2310;}
.rail-button[aria-pressed="true"]::before{content:"";position:absolute;width:3px;left:-4px;top:8px;bottom:8px;background:#2d8a68;border-radius:3px;}
.rail-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.rail-button span{font-size:11px;line-height:1;white-space:nowrap;}
.rail-spacer{flex:1;}
.rail-bottom{height:31px!important;}
.pane-head .small-info{font-size:10px;color:#8b9890;font-weight:400;}
.left.collapsed{width:34px!important;}
.left.collapsed .layer-content{display:none;}
.work.auto-collapse .left:not(.manual-open){width:34px!important;}
.work.auto-collapse .left:not(.manual-open) .layer-content,.work.auto-collapse .left:not(.manual-open) .pane-head b{display:none;}
.work.auto-collapse .left:not(.manual-open) .pane-head{padding:0;justify-content:center;}
.work.auto-collapse .left:not(.manual-open) .head-actions button{display:none;}
.work.auto-collapse .left:not(.manual-open) .head-actions .mini-button{display:block;}
.work:not(.auto-collapse) .left.manual-open{position:relative;top:auto;bottom:auto;box-shadow:none;}
.work .left.manual-open{position:relative;top:auto;bottom:auto;box-shadow:none;}
.mini-button{font-size:16px;}
.panel-subnav{height:31px;flex:0 0 auto;display:flex;border-bottom:1px solid var(--border)}
.panel-subnav button{background:#fff;flex:1;border:0;border-right:1px solid var(--border);font-size:12px;color:#66796e;}
.panel-subnav button.active{box-shadow:inset 0 -2px #35886e;background:#fbfdfb;color:#185d45;}
.result-hint{padding:8px 11px;color:#84948a;font-size:11px;border-bottom:1px solid #ecf1eb;}
.task-item{padding:11px;border-bottom:1px solid #e6ece7;display:flex;align-items:center;gap:9px;}
.task-item strong{font-weight:600;}
.task-item .muted{margin-left:auto;font-size:11px;white-space:nowrap;}
.task-icon{width:26px;height:26px;background:#e8f2e9;border:1px solid #d6e4d7;border-radius:5px;display:grid;place-items:center;color:#4d785e;font-size:15px;}
.right .footer-actions{margin-top:auto;}
.map{min-width:260px;}
@media(max-width:1050px){.right{width:315px}.left:not(.collapsed):not(.manual-open){width:216px}}
@media(max-width:760px){.right{width:min(320px,48vw)}.map{min-width:200px}.left.manual-open{width:180px!important}.left{width:34px}.right-rail{width:40px;flex-basis:40px}.rail-button{width:33px}}
@media(max-width:580px){.right{width:min(260px,52vw)}.map{min-width:170px}.ribbon-caption{display:none}}

<div class="work" id="work"><aside class="pane left" id="left"><div class="pane-head"><b>图层</b><div class="head-actions"><button class="tiny mini-button" id="reopenLayers" title="展开图层">☰</button><button class="tiny" id="collapseLayers" title="收起图层">‹</button></div></div><div class="layer-content"><div class="layer-item active"><input type="checkbox" class="check" checked aria-label="显示水文站点"><span class="swatch" style="background:#2e83a6"></span><span class="layer-name">水文站点</span></div><div class="layer-item"><input type="checkbox" class="check" checked aria-label="显示河流水系"><span class="swatch" style="background:#8fb8cf"></span><span class="layer-name">河流水系</span></div><div class="layer-item"><input type="checkbox" class="check" checked aria-label="显示行政区划"><span class="swatch" style="background:#c8e4cd"></span><span class="layer-name">行政区划</span></div><div class="layer-small">3 个图层 · 当前图层：水文站点</div></div></aside>
<main class="map"><span class="map-header">示意地图 · 点击蓝色站点</span><svg class="map-svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice" aria-label="地图示意"><path class="basin" d="M-30 80Q150 65 200 123T350 180Q480 220 560 130T920 120L910 600H-20Z"/><path class="road" d="M-30 410Q150 370 220 420T480 330Q560 260 930 290"/><path class="road-mid" d="M-30 410Q150 370 220 420T480 330Q560 260 930 290"/><path class="river" d="M-50 280Q120 230 230 300T430 270Q620 210 670 300T960 350"/><text x="345" y="245" class="dot-label">主要河流</text><text x="535" y="388" class="dot-label">城区</text><circle tabindex="0" role="button" aria-label="站点 A" data-station="a" class="station" cx="230" cy="300" r="9"/><circle tabindex="0" role="button" aria-label="站点 B" data-station="b" class="station" cx="430" cy="270" r="9"/><circle tabindex="0" role="button" aria-label="站点 C" data-station="c" class="station" cx="670" cy="300" r="9"/><text x="245" y="286" class="dot-label">站点 A</text><text x="443" y="258" class="dot-label">站点 B</text><text x="688" y="289" class="dot-label">站点 C</text></svg><div class="map-hint" id="mapHint">当前：选择要素。点击任意站点，只会改变选择，不会打开信息面板。</div></main>
<aside class="pane right" id="rightPane" aria-label="右侧工作窗格">
  <div class="pane-head"><b id="rightTitle">图层属性</b><div class="head-actions"><span class="small-info" id="targetName">水文站点</span><button class="tiny" id="closeRight" title="收起右侧内容（保留竖向入口）" aria-label="收起右侧内容">×</button></div></div>
  <div class="right-view active" id="properties">
    <div class="panel-subnav" role="tablist" aria-label="图层属性栏目"><button class="active" data-tab="layer">图层</button><button data-tab="style">样式</button><button data-tab="label">标注</button></div>
    <div class="result-main" id="propContent"><div class="group"><div class="group-title">水文站点</div><div class="property"><label>数据类型</label><span>点 · 本地矢量</span></div><div class="property"><label>要素数</label><span>3</span></div><div class="property"><label>不透明度</label><input type="range" min="0" max="100" value="100" aria-label="不透明度" /></div></div></div>
  </div>
  <div class="right-view" id="identifyPane">
    <div class="identify-tools"><span class="muted">识别范围</span><select id="identifyScope"><option value="active">当前图层</option><option value="visible">所有可见图层</option></select><button class="tiny" id="clearInfo" title="清空识别结果" aria-label="清空识别结果">↺</button></div>
    <div class="result-main" id="results"><div class="empty">选择「识别信息」工具，然后点击地图中的要素。</div></div>
    <div class="footer-actions"><button class="button" id="copyResult">复制属性</button><button class="button" id="openTable">打开属性表</button></div>
  </div>

    <div class="result-hint">空间处理工具（示意）</div>

    <div class="task-item"><span class="task-icon">◫</span><strong>裁剪</strong></div>
    <div class="task-item"><span class="task-icon">⌗</span><strong>融合</strong></div>

  </div>
</aside>
<nav class="right-rail" aria-label="右侧面板切换">
  <button class="rail-button" data-pane="properties" aria-pressed="true" title="图层属性" aria-label="图层属性"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8 M8 12h8 M8 16h5"/></svg><span>属性</span></button>
  <button class="rail-button" data-pane="identify" aria-pressed="false" title="识别信息（点击地图查看）" aria-label="识别信息"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6 M12 7v.5"/></svg><span>信息</span></button>
  <button class="rail-button" data-pane="processing" aria-pressed="false" title="空间处理" aria-label="空间处理"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 14h6v6h-6zM7 10v5h10v-1"/><path d="M14 4h6M17 1v6"/></svg><span>处理</span></button>

</nav></div>
<div class="status"><span>模式：<b id="bottomMode">选择</b></span><span id="selectionStatus">已选 0</span><span id="widthStatus">地图可用空间优先 · 独立右侧窗格</span><span>EPSG:3857</span></div></div>
<script>
const rows={a:{名称:'水文站 A',编号:'STA-001',类型:'水位站',所属河流:'主要河流',水位:'12.4 m',采集时间:'2026-10-22 15:00',状态:'正常'},b:{名称:'水文站 B',编号:'STA-002',类型:'流量站',所属河流:'主要河流',流量:'836 m³/s',采集时间:'2026-10-22 15:00',状态:'正常'},c:{名称:'水文站 C',编号:'STA-003',类型:'雨量站',所属河流:'主要河流',降雨量:'18.5 mm',采集时间:'2026-10-22 15:00',状态:'正常'}};
let mode='select',choice=null,selected=null,right='properties',previousRight='properties',leftManual=false,manuallyCollapsedLeft=false;
const $=id=>document.getElementById(id);
function narrow(){return window.innerWidth<1050}
function openPane(name){
  if(name==='closed'){if(right!=='closed')previousRight=right;right='closed'}
  else {right=name;previousRight=name;if(narrow())leftManual=false;}
  refresh();
}
function refresh(){
  const compact=narrow()&&right!=='closed'&&!leftManual;
  $('work').classList.toggle('auto-collapse',compact);
  $('left').classList.toggle('manual-open',leftManual);
  $('left').classList.toggle('collapsed',manuallyCollapsedLeft||compact);
  $('rightPane').classList.toggle('closed',right==='closed');
  $('properties').classList.toggle('active',right==='properties');
  $('identifyPane').classList.toggle('active',right==='identify');
  $('processingPane').classList.toggle('active',right==='processing');
  $('rightTitle').textContent={properties:'图层属性',identify:'识别信息',processing:'空间处理'}[right]??'图层属性';
  $('targetName').textContent=right==='properties'?'水文站点':'';
  document.querySelectorAll('[data-pane]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.pane===right)));
  $('toggleRight').title=right==='closed'?'展开右侧内容':'收起右侧内容';
  $('toggleRight').querySelector('path').setAttribute('d',right==='closed'?'M9 5l7 7-7 7':'M15 5l-7 7 7 7');
  for(const c of document.querySelectorAll('[data-station]')){
    c.classList.toggle('identified',choice===c.dataset.station&&right==='identify');
    c.classList.toggle('selected',selected===c.dataset.station&&!(choice===c.dataset.station&&right==='identify'));
  }
  for(const [a,m] of [['modeSelect','select'],['modeIdentify','identify']])$(a).classList.toggle('active',mode===m);
  $('modeNote').textContent=mode==='select'?'选择模式 · 点击站点选择要素':'识别模式 · 点击站点查看信息';
  $('bottomMode').textContent=mode==='select'?'选择':'识别信息';
  $('selectionStatus').textContent='已选 '+(selected?1:0);
  $('mapHint').textContent=mode==='select'?'选择模式：点击站点只会改变选择，不会弹出识别信息。':'识别模式：点击站点，在右侧「信息」显示属性；不会改变选择。';
  $('widthStatus').textContent=compact?'窄窗口：右侧展开时自动收起左侧图层':'右侧竖栏：只展开一个工作面板';
  if(right==='identify')renderResult();
}
function renderResult(){
  if(!choice){$('results').innerHTML='<div class="empty">尚无识别结果。选择顶部「识别信息」，点击地图上的点位。</div>';return}
  const r=rows[choice];
  $('results').innerHTML=`<div class="result-choice"><span class="circle"></span><span class="result-title">水文站点 / ${r.名称}</span><span class="result-tag">点</span></div><table class="detail-table"><tbody>${Object.entries(r).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</tbody></table>`;
}
$('modeSelect').onclick=()=>{mode='select';refresh()};
$('modeIdentify').onclick=()=>{mode='identify';openPane('identify')};
function hitStation(id){if(mode==='identify'){choice=id;openPane('identify')}else{selected=selected===id?null:id;refresh()}}
document.querySelectorAll('[data-station]').forEach(el=>{el.onclick=()=>hitStation(el.dataset.station);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hitStation(el.dataset.station)}}});
document.querySelectorAll('[data-pane]').forEach(el=>{el.onclick=()=>openPane(el.dataset.pane===right?'closed':el.dataset.pane)});
$('closeRight').onclick=()=>openPane('closed');
$('toggleRight').onclick=()=>openPane(right==='closed'?previousRight:'closed');
$('clearInfo').onclick=()=>{choice=null;refresh()};
$('copyResult').onclick=()=>{if(choice){navigator.clipboard?.writeText(JSON.stringify(rows[choice],null,2)).then(()=>{$('mapHint').textContent='已复制当前要素属性'}).catch(()=>{$('mapHint').textContent='浏览器禁止剪贴板操作'})}};
$('openTable').onclick=()=>{$('mapHint').textContent=choice?`已从「${rows[choice].名称}」识别结果打开属性表（原型示意）`:'请先识别要素'};
$('collapseLayers').onclick=()=>{leftManual=false;manuallyCollapsedLeft=true;refresh()};
$('reopenLayers').onclick=()=>{manuallyCollapsedLeft=false;leftManual=true;if(narrow()&&right!=='closed'){previousRight=right;right='closed'}refresh()};
$('identifyScope').onchange=()=>{$('mapHint').textContent='识别范围已切换（原型仅模拟站点）'};
document.querySelectorAll('[data-tab]').forEach(tab=>tab.onclick=()=>{
  document.querySelectorAll('[data-tab]').forEach(e=>e.classList.toggle('active',e===tab));
  const name={layer:'图层',style:'样式',label:'标注'}[tab.dataset.tab];
  $('propContent').innerHTML=tab.dataset.tab==='layer'?'<div class="group"><div class="group-title">水文站点</div><div class="property"><label>数据类型</label><span>点 · 本地矢量</span></div><div class="property"><label>要素数</label><span>3</span></div><div class="property"><label>不透明度</label><input type="range" value="100" aria-label="不透明度" /></div></div>':`<div class="group"><div class="group-title">${name}</div><div class="property"><label>${name==='样式'?'当前符号':'标注字段'}</label><span>${name==='样式'?'圆形 · 蓝色 · 6px':'名称'}</span></div></div>`;
});
window.addEventListener('resize',()=>{if(narrow()&&right!=='closed')leftManual=false;refresh()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&mode==='identify'){mode='select';refresh()}});
refresh();
</script></body></html>
