<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>my-web-gis · 样式编辑器 V4</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif;color:#242a31;font-size:12px;font-synthesis:none;background:#eff1f3}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.38}button,input,select,textarea{outline-offset:1px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #4a7ab1}
.app{width:min(100%,525px);min-height:100vh;margin:0 auto;background:#fff;border-left:1px solid #cfd4d9;border-right:1px solid #cfd4d9;display:flex;flex-direction:column}
.header{min-height:43px;padding:0 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #d9dce0;background:#f9fafb}
.header .name{font-size:13px;font-weight:650;letter-spacing:.1px}.header .sub{color:#858b93;font-size:11px;margin-left:3px}.header .grow{flex:1}
button.tiny{height:25px;min-width:28px;border:1px solid #ced3d9;background:#fff;border-radius:3px;padding:0 9px;white-space:nowrap}button.tiny:hover:not(:disabled){background:#f0f4f8;border-color:#9fafbe}button.ghost{background:transparent;border-color:transparent;color:#535e6d}
.content{flex:1;min-height:0;overflow:auto}.toolbar{padding:10px 12px 8px;border-bottom:1px solid #dfe2e5}.field{display:flex;gap:8px;align-items:center;min-height:28px;margin-bottom:5px}.field:last-child{margin-bottom:0}.field label,.field>.label{color:#565f6b;min-width:60px;white-space:nowrap;flex:0 0 60px}.field input[type=text],.field input[type=number],.field select,.field textarea{min-width:0;height:27px;width:100%;padding:3px 8px;border:1px solid #c9ced5;background:white;border-radius:3px}.field textarea{height:auto;resize:vertical}
.field.split{gap:10px}.field.split .mini{display:flex;align-items:center;gap:5px;min-width:0;flex:1}.field.split .mini label{color:#626b76;min-width:auto;flex:none}.field.split .mini:nth-child(1){flex:1.1}.field.split .mini:nth-child(2){flex:.9}
.h{height:30px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#f7f8f9;border-top:1px solid #e4e6e8;border-bottom:1px solid #e5e7e9;font-weight:600;color:#39424c}.h .right{margin-left:auto;font-weight:400;color:#697582}.h button{font-weight:400}
.table-wrap{margin:0 12px;border:1px solid #d6dbe0;border-radius:3px;overflow:hidden}.data-table{width:100%;border-collapse:collapse;table-layout:fixed}.data-table th{height:27px;background:#f7f8f9;border-bottom:1px solid #d6dbe0;color:#69717b;text-align:left;font-size:11px;font-weight:500;padding:0 8px}.data-table td{height:32px;padding:0 8px;border-bottom:1px solid #ebedf0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.data-table tbody tr:last-child td{border-bottom:0}.data-table tbody tr:hover{background:#f3f7fa}.data-table tbody tr.active{background:#e6f0fa}.data-table tbody tr{cursor:pointer}.data-table .center{text-align:center}.swatch{display:inline-block;width:43px;height:12px;vertical-align:middle;border-radius:1px;cursor:pointer;position:relative}.swatch.line:after{content:'';position:absolute;left:0;right:0;top:5px;height:2px;background:currentColor}.editable{width:100%;min-width:0;border:1px solid transparent;background:transparent;height:24px;padding:0 4px;border-radius:2px}.editable:focus{background:#fff;border-color:#6390ba;outline:none}.no-data{padding:24px 12px;color:#79818a;text-align:center}.table-tools{display:flex;gap:5px;align-items:center;padding:7px 12px 9px}.table-tools .spacer{flex:1}.counter{color:#858d95;font-variant-numeric:tabular-nums}.group{padding:9px 12px 12px}.param-row{display:flex;align-items:center;min-height:33px;gap:8px}.param-row>.key{flex:none;width:60px;color:#5a6570}.param-row .value{flex:1;display:flex;align-items:center;gap:6px;min-width:0}.param-row input[type="number"],.param-row input[type="text"],.param-row select{height:26px;border:1px solid #cdd2d9;border-radius:3px;padding:3px 6px;min-width:0;background:#fff}.param-row select{width:100%}.param-row input[type="number"]{width:94px}.param-row input[type="range"]{flex:1;accent-color:#547da4;min-width:60px}.unit{color:#8a9299;font-size:11px}.chip{padding:3px 7px;border:1px solid #b4cadf;border-radius:3px;background:#eef4fa;color:#325b7e;font-size:11px;white-space:nowrap}.chip:hover{background:#e0ecf7}.color-input{display:flex;align-items:center;gap:7px}.color-input input[type="color"]{width:35px;height:25px;padding:2px;border:1px solid #c9cdd3;background:#fff;border-radius:3px;cursor:pointer}.color-input code{font-size:11px;color:#59616d}.stat{margin-left:auto;color:#7a838c;font-size:11px}.hint{color:#818b93;font-size:11px}.toggle{width:15px;height:15px;accent-color:#4777a8;vertical-align:middle}.flatline{height:1px;background:#eaeced;margin:8px 0}.more{display:flex;justify-content:space-between;align-items:center;color:#536170;cursor:pointer;padding:0 12px;height:30px;border-top:1px solid #e4e6e8;border-bottom:1px solid #e4e6e8;background:#fafafa}.more:hover{background:#f3f5f7}.more:after{content:'▸';color:#9ca5ae;font-size:12px}.more.open:after{content:'▾'}.footer{height:32px;padding:0 12px;border-top:1px solid #d9dce0;background:#fafbfc;display:flex;align-items:center;justify-content:space-between;color:#7b858f;font-size:11px}.footer .unsaved{color:#ae742a}.footer button{border:none;background:none;color:#476d91;padding:2px 4px;font-size:11px}
.modal-backdrop{position:fixed;inset:0;background:rgba(24,35,48,.29);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}.modal{background:#fff;border:1px solid #b8c1cb;border-radius:5px;box-shadow:0 12px 40px #0003;width:min(600px,100%);max-height:min(92vh,760px);display:flex;flex-direction:column}.modal-head{height:43px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #dfe2e5;font-weight:650;font-size:13px}.modal-head button{margin-left:auto;border:0;background:none;font-size:21px;color:#838d95;line-height:1;padding:0 3px}.modal-body{padding:15px 16px;overflow:auto;min-height:60px}.modal-foot{border-top:1px solid #e1e5e8;padding:10px 16px;display:flex;align-items:center;gap:8px;justify-content:flex-end}.modal-foot .left{margin-right:auto;color:#858e96;font-size:11px}.mrow{display:flex;align-items:center;gap:9px;margin:0 0 10px;min-height:28px}.mrow>label{flex:0 0 88px;color:#616b75}.mrow select,.mrow input[type=text],.mrow input[type=number]{height:28px;border:1px solid #cbd1d8;background:white;border-radius:3px;padding:4px 8px;min-width:0}.mrow select{flex:1}.mrow input[type=text]{flex:1}.mrow input[type=number]{width:110px}.modal-tabs{display:flex;gap:0;border-bottom:1px solid #cfd7df;margin-bottom:15px}.modal-tabs button{border:0;background:transparent;height:32px;padding:0 17px;color:#626e78;border-bottom:2px solid transparent}.modal-tabs button.selected{color:#245c89;border-bottom-color:#477bb0;font-weight:650}.stop-table{border-collapse:collapse;width:100%}.stop-table th{height:28px;text-align:left;color:#626a75;font-weight:500;background:#f4f6f8;border-top:1px solid #e2e5e9;border-bottom:1px solid #d9dfe4;padding:0 9px}.stop-table td{border-bottom:1px solid #e8ecf0;padding:4px 9px}.stop-table input{width:100%;height:28px;border:1px solid #cbd1d7;border-radius:3px;padding:0 6px}.stop-table button{border:0;background:none;color:#788592;font-size:17px}.stop-table button:hover{color:#aa4242}.preview-area{border:1px solid #d7dce1;margin-top:12px;padding:12px;background:#fcfdfe;border-radius:3px}.preview-svg{width:100%;height:40px}.msection{font-weight:600;padding:10px 0 7px;color:#424c56}.help{color:#8a939c;font-size:11px;padding-top:5px}.error{color:#af4040;font-size:11px;min-height:14px}.save-indicator{font-variant-numeric:tabular-nums}.blank{padding:20px 12px;color:#8c939b}.check-row{display:flex;align-items:center;gap:8px;padding:4px 0}.rule-name{font-weight:550}.rule-expression{display:block;color:#808994;font-size:11px;margin-top:2px}.kv{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;margin:10px 0}.kv label{color:#606b76}.kv input,.kv select{border:1px solid #c9d0d7;border-radius:3px;height:27px;padding:4px 7px;min-width:0}.kv textarea{border:1px solid #c9d0d7;border-radius:3px;min-height:64px;resize:vertical;padding:8px}.linkbtn{background:none;border:none;color:#4777a7;padding:4px 0;cursor:pointer}.linkbtn:hover{text-decoration:underline}.section-tools{display:flex;align-items:center;justify-content:space-between;gap:6px}.summary-box{font-size:11px;color:#737f8c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:760px){.app{box-shadow:0 0 0 1px #e0e3e6}}@media(max-width:420px){.header{padding:0 8px}.toolbar{padding:8px}.table-wrap{margin:0 8px}.table-tools,.group{padding-left:8px;padding-right:8px}.field>.label,.field label{flex-basis:56px;min-width:56px}.h{padding:0 8px}.mrow{flex-wrap:wrap}.mrow>label{flex-basis:100%}.modal-body{padding:12px}.footer{padding:0 8px}}
</style>
</head>
<body>
<div class="app">
  <div class="header"><span class="name">河流</span><span class="sub">样式</span><span class="grow"></span><button class="tiny ghost" id="undo" title="撤销 Ctrl+Z">撤销</button><button class="tiny ghost" id="redo" title="重做 Ctrl+Y">重做</button><button class="tiny" id="save" title="保存项目 Ctrl+S">保存</button></div>
  <div class="content" id="editor"></div>
  <div class="footer"><span id="state" class="save-indicator">已保存</span><span><button id="reset">恢复默认</button></span></div>
</div>
<div id="modalRoot"></div>
<script>
(()=>{
'use strict';
const clone=x=>JSON.parse(JSON.stringify(x));
const initial={
 renderer:'categorized',field:'river_type',ramp:'blues',
 categories:[{value:'main',label:'主河道',color:'#267cb7',count:42},{value:'primary',label:'一级支流',color:'#58a6ce',count:133},{value:'secondary',label:'二级支流',color:'#9dcddd',count:524}],
 graduated:[{value:100,label:'0 – 100',color:'#c8ddec',count:320},{value:500,label:'100 – 500',color:'#79b1d2',count:280},{value:1000,label:'500 以上',color:'#267cb7',count:99}],
 rules:[{id:1,name:'主河道',expr:"river_type = 'main'",minZoom:0,maxZoom:24,color:'#267cb7',enabled:true},{id:2,name:'普通河流',expr:'ELSE',minZoom:10,maxZoom:24,color:'#78b7da',enabled:true}],
 selected:0,baseColor:'#267cb7',lineType:'solid',opacity:100,
 width:{kind:'zoom',fixed:2.5,interpolation:'linear',stops:[{z:8,v:1},{z:12,v:2.5},{z:16,v:6}],field:'flow',factor:.02},
 layer:{minZoom:0,maxZoom:24},labelEnabled:false,
 advanced:{lineCap:'round',lineJoin:'round',dash:'',offset:0},
};
let state=clone(initial),saved=JSON.stringify(state),past=[],future=[],modal=null,selectedModalTab='zoom',zoomPreview=12,extraExpanded=false;
const $=(s,root=document)=>root.querySelector(s);
const htmlEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const selectOpts=(arr,selected)=>arr.map(([value,name])=>`<option value="${htmlEsc(value)}" ${String(value)===String(selected)?'selected':''}>${htmlEsc(name)}</option>`).join('');
function widthAt(z,attrs={flow:125}){const p=state.width;if(p.kind==='fixed')return p.fixed;if(p.kind==='field')return Math.max(.1,(attrs[p.field]??100)*p.factor); const stops=[...p.stops].sort((a,b)=>a.z-b.z);if(!stops.length)return p.fixed;if(z<=stops[0].z)return stops[0].v;if(z>=stops[stops.length-1].z)return stops[stops.length-1].v;for(let i=1;i<stops.length;i++)if(z<=stops[i].z){if(p.interpolation==='step')return stops[i-1].v;const t=(z-stops[i-1].z)/(stops[i].z-stops[i-1].z);return stops[i-1].v+(stops[i].v-stops[i-1].v)*t}return p.fixed}
function change(fn,{rerender=true}={}){const before=JSON.stringify(state);fn(state);if(JSON.stringify(state)===before)return;past.push(before);if(past.length>90)past.shift();future=[];if(rerender)render();else updateHeader()}
function updateHeader(){const dirty=JSON.stringify(state)!==saved;$('#state').textContent=dirty?'未保存':'已保存';$('#state').className='save-indicator'+(dirty?' unsaved':'');$('#undo').disabled=!past.length;$('#redo').disabled=!future.length}
function setVal(path,value){change(s=>{s[path]=value})}
function modeDetails(){const r=state.renderer;if(r==='single')return '';if(r==='rules')return `<div class="field"><label>规则</label><div class="summary-box">按表达式与 Zoom 范围绘制</div><span style="flex:1"></span><button class="tiny" id="addRuleTop">添加规则</button></div>`;return `<div class="field split"><div class="mini"><label>${r==='categorized'?'分类字段':'分级字段'}</label><select id="field">${selectOpts(r==='categorized'?[['river_type','river_type'],['status','status'],['region','region']]:[['flow','flow'],['length','length'],['grade','grade']],state.field)}</select></div><div class="mini"><label>色带</label><select id="ramp">${selectOpts([['blues','蓝色'],['warm','暖色'],['gray','灰阶']],state.ramp)}</select></div></div>`}
function tableData(){if(state.renderer==='categorized')return state.categories.map((x,i)=>({...x,index:i}));if(state.renderer==='graduated')return state.graduated.map((x,i)=>({...x,index:i}));if(state.renderer==='rules')return state.rules.map((x,i)=>({...x,index:i}));return []}
function table(){const r=state.renderer;const data=tableData();if(r==='single')return '';
const headers=r==='rules'?`<tr><th style="width:26px"></th><th style="width:66px">符号</th><th>规则 / 条件</th><th style="width:75px">Zoom</th></tr>`:r==='categorized'?`<tr><th style="width:76px">符号</th><th style="width:95px">值</th><th>图例</th><th style="width:55px">数量</th></tr>`:`<tr><th style="width:76px">符号</th><th style="width:100px">上界</th><th>图例</th><th style="width:55px">数量</th></tr>`;
const rows=data.map((x,i)=>{let color=x.color;const swatch=`<span class="swatch line" style="color:${htmlEsc(color)}" data-pick-color="${i}" title="点击修改颜色"></span>`;
if(r==='rules')return `<tr class="${state.selected===i?'active':''}" data-row="${i}"><td><input class="toggle" type="checkbox" data-rule-enabled="${i}" ${x.enabled?'checked':''}></td><td>${swatch}</td><td><span class="rule-name">${htmlEsc(x.name)}</span><span class="rule-expression">${htmlEsc(x.expr)}</span></td><td>Z${x.minZoom}–${x.maxZoom===24?'∞':x.maxZoom}</td></tr>`;
return `<tr class="${state.selected===i?'active':''}" data-row="${i}"><td>${swatch}</td><td>${r==='categorized'?htmlEsc(x.value):'≤ '+htmlEsc(x.value)}</td><td><input class="editable" data-label="${i}" value="${htmlEsc(x.label)}" aria-label="图例名称"></td><td style="color:#7c8691;text-align:right">${x.count??'—'}</td></tr>`}).join('');
return `<div class="h"><span>${r==='categorized'?'分类列表':r==='graduated'?'分级列表':'规则列表'}</span><span class="right">${data.length} ${r==='rules'?'条':'项'}</span></div><div style="height:8px"></div><div class="table-wrap"><table class="data-table"><thead>${headers}</thead><tbody>${rows||`<tr><td colspan="4" class="no-data">暂无记录</td></tr>`}</tbody></table></div><div class="table-tools"><button class="tiny" id="classify">${r==='rules'?'新建规则':r==='categorized'?'分类':'重新分级'}</button><button class="tiny" id="addItem">添加</button><button class="tiny" id="removeItem" ${data.length?'':'disabled'}>删除</button><span class="spacer"></span><button class="tiny ghost" id="manage">${r==='rules'?'规则编辑…':r==='categorized'?'分类管理…':'分级断点…'}</button></div>`}
function property(){const r=state.renderer;const x=tableData()[state.selected];let title=r==='single'?'线符号':r==='rules'?'规则符号':x?`线符号 · ${x.label}`:'线符号';const col=r==='single'?state.baseColor:(x?.color||state.baseColor);const w=state.width;const dynamic=w.kind!=='fixed';
return `<div class="h"><span>${htmlEsc(title)}</span><span class="right"><button class="tiny ghost" id="advSymbol">符号编辑…</button></span></div><div class="group">
<div class="param-row"><span class="key">颜色</span><div class="value"><span class="color-input"><input aria-label="颜色" id="baseColor" type="color" value="${htmlEsc(col)}"><code id="hexDisplay">${htmlEsc(col.toUpperCase())}</code></span></div></div>
<div class="param-row"><span class="key">线宽</span><div class="value">${dynamic?`<span style="color:#3c4854;min-width:78px">${w.kind==='zoom'?'随 Zoom':'按字段'}</span><span class="stat" style="margin:0">${w.kind==='zoom'?w.stops.length+' 节点':htmlEsc(w.field)}</span>`:`<input id="widthNum" type="number" min="0.1" max="60" step="0.1" value="${w.fixed}"><span class="unit">px</span>`}<span style="flex:1"></span><button class="chip" id="zoomSetup">${w.kind==='zoom'?'Z · 变化曲线':w.kind==='field'?'字段映射…':'动态设置…'}</button></div></div>
<div class="param-row"><span class="key">线型</span><div class="value"><select id="lineType">${selectOpts([['solid','实线'],['dash','虚线'],['dot','点线']],state.lineType)}</select></div></div>
<div class="param-row"><span class="key">透明度</span><div class="value"><input id="opacity" type="range" min="0" max="100" value="${state.opacity}"><span style="width:40px;text-align:right;font-variant-numeric:tabular-nums" id="opacityText">${state.opacity}%</span></div></div>
</div>`}
function render(){const mode=state.renderer;const single=mode==='single';$('#editor').innerHTML=`<div class="toolbar"><div class="field"><label>渲染方式</label><select style="flex:1;min-width:0;height:27px;border:1px solid #c9ced5;border-radius:3px;padding:3px 8px;background:#fff" id="renderer">${selectOpts([['single','单一符号'],['categorized','分类渲染'],['graduated','分级渲染'],['rules','规则渲染']],mode)}</select></div>${modeDetails()}</div>${table()}${property()}<div class="more ${extraExpanded?'open':''}" id="more">图层渲染</div><div id="extra" ${extraExpanded?'':'hidden'}></div>`;
$('#renderer').onchange=e=>change(s=>{s.renderer=e.target.value;s.selected=0;s.field=e.target.value==='graduated'?'flow':'river_type'});
if($('#field'))$('#field').onchange=e=>change(s=>{s.field=e.target.value});
if($('#ramp'))$('#ramp').onchange=e=>change(s=>{s.ramp=e.target.value;const palette=e.target.value==='blues'?['#267cb7','#58a6ce','#9dcddd']:e.target.value==='warm'?['#b15c31','#d18b56','#eabf83']:['#485766','#87919b','#c3c7cc'];if(s.renderer==='categorized')s.categories.forEach((c,i)=>c.color=palette[i%3]);else s.graduated.forEach((c,i)=>c.color=palette[i%3])});
$('#baseColor').oninput=e=>{let v=e.target.value;const x=tableData()[state.selected];if(state.renderer==='single')state.baseColor=v;else if(x){(state.renderer==='rules'?state.rules:state.renderer==='categorized'?state.categories:state.graduated)[state.selected].color=v}$('#hexDisplay').textContent=v.toUpperCase();updateHeader()};
$('#baseColor').onchange=e=>{const v=e.target.value; // capture final value as one undo transaction
const x=tableData()[state.selected];const now=JSON.stringify(state);const colorBefore=e.target.dataset.colorBefore;if(colorBefore&&colorBefore!==v){let prev=JSON.parse(now);if(prev.renderer==='single')prev.baseColor=colorBefore;else{const list=prev.renderer==='rules'?prev.rules:prev.renderer==='categorized'?prev.categories:prev.graduated;if(list[prev.selected])list[prev.selected].color=colorBefore}past.push(JSON.stringify(prev));future=[]}updateHeader()};
$('#baseColor').onfocus=e=>{e.target.dataset.colorBefore=e.target.value};
$('#lineType').onchange=e=>setVal('lineType',e.target.value);
if($('#widthNum'))$('#widthNum').onchange=e=>change(s=>s.width.fixed=Math.max(.1,+e.target.value||.1));
$('#opacity').oninput=e=>{$('#opacityText').textContent=e.target.value+'%';state.opacity=+e.target.value;updateHeader()};
$('#opacity').onpointerdown=e=>{e.target.dataset.before=JSON.stringify(state)};
$('#opacity').onchange=e=>{if(e.target.dataset.before&&e.target.dataset.before!==JSON.stringify(state)){past.push(e.target.dataset.before);future=[]}updateHeader()};
$('#zoomSetup').onclick=()=>openModal('zoom');$('#advSymbol').onclick=()=>openModal('symbol');
if(extraExpanded)renderExtra();$('#more').onclick=()=>{extraExpanded=!extraExpanded;const m=$('#more'),ex=$('#extra');m.classList.toggle('open',extraExpanded);ex.hidden=!extraExpanded;if(extraExpanded)renderExtra()};
if(!single){$('#classify').onclick=()=>{if(mode==='rules'){addRule()}else{change(s=>{const arr=mode==='categorized'?s.categories:s.graduated;const palette=s.ramp==='blues'?['#267cb7','#58a6ce','#9dcddd']:s.ramp==='warm'?['#b15c31','#d18b56','#eabf83']:['#485766','#87919b','#c3c7cc'];arr.forEach((x,i)=>x.color=palette[i%3])})}};$('#addItem').onclick=()=>{if(mode==='rules')addRule();else change(s=>{const arr=mode==='categorized'?s.categories:s.graduated;arr.push(mode==='categorized'?{value:'new_'+(arr.length+1),label:'新类别',color:'#aab7c2',count:0}:{value:Math.round(((arr.at(-1)?.value||0)+100)),label:'新分级',color:'#aab7c2',count:0});s.selected=arr.length-1})};$('#removeItem').onclick=()=>change(s=>{const arr=mode==='rules'?s.rules:mode==='categorized'?s.categories:s.graduated;arr.splice(s.selected,1);s.selected=Math.max(0,Math.min(s.selected,arr.length-1))});$('#manage').onclick=()=>openModal(mode==='rules'?'ruleList':mode==='categorized'?'categories':'breaks');
document.querySelectorAll('[data-row]').forEach(row=>{row.onclick=e=>{if(e.target.closest('input')||e.target.closest('[data-pick-color]'))return;state.selected=+row.dataset.row;render()};row.ondblclick=e=>{if(e.target.closest('input'))return;state.selected=+row.dataset.row;openModal(mode==='rules'?'rule': 'symbol');}});
document.querySelectorAll('[data-label]').forEach(inp=>{inp.onchange=e=>change(s=>{const arr=mode==='categorized'?s.categories:s.graduated;arr[+e.target.dataset.label].label=e.target.value});inp.onclick=e=>e.stopPropagation()});
document.querySelectorAll('[data-rule-enabled]').forEach(inp=>{inp.onclick=e=>e.stopPropagation();inp.onchange=e=>change(s=>s.rules[+e.target.dataset.ruleEnabled].enabled=e.target.checked)});
document.querySelectorAll('[data-pick-color]').forEach(el=>el.onclick=e=>{e.stopPropagation();state.selected=+el.dataset.pickColor;render();$('#baseColor').focus()})}
updateHeader()}
function renderExtra(){const x=$('#extra');if(!x)return;x.innerHTML=`<div class="group"><div class="param-row"><span class="key">最小 Zoom</span><div class="value"><input id="layerMin" type="number" min="0" max="24" step="1" value="${state.layer.minZoom}"><span style="margin-left:8px;color:#626b75">最大 Zoom</span><input id="layerMax" type="number" min="0" max="24" step="1" value="${state.layer.maxZoom}"></div></div><div class="param-row"><span class="key">标注</span><div class="value"><label><input id="labelEnabled" type="checkbox" ${state.labelEnabled?'checked':''}> 开启图层标注</label></div></div></div>`;$('#layerMin').onchange=e=>change(s=>s.layer.minZoom=Math.min(24,Math.max(0,+e.target.value)));$('#layerMax').onchange=e=>change(s=>s.layer.maxZoom=Math.min(24,Math.max(s.layer.minZoom,+e.target.value)));$('#labelEnabled').onchange=e=>change(s=>s.labelEnabled=e.target.checked)}
function addRule(){change(s=>{s.rules.push({id:Date.now(),name:'新规则',expr:'',minZoom:0,maxZoom:24,color:'#b66b32',enabled:true});s.selected=s.rules.length-1});openModal('rule')}
function openModal(type){modal=type;zoomPreview=12;selectedModalTab=state.width.kind==='fixed'?'fixed':state.width.kind==='field'?'field':'zoom';renderModal()}
function closeModal(){modal=null;$('#modalRoot').innerHTML='';render()}
function dialogShell(title,body,footer=''){return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${htmlEsc(title)}"><div class="modal-head">${htmlEsc(title)}<button id="closeModal" aria-label="关闭">×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><span class="left">${JSON.stringify(state)===saved?'已保存':'未保存'}</span>${footer||'<button class="tiny" id="modalDone">关闭</button>'}</div></section></div>`}
function zoomTabContent(){const p=state.width;const v=widthAt(zoomPreview).toFixed(2);if(selectedModalTab==='fixed')return `<div class="mrow"><label>线宽</label><input type="number" id="fixedSize" value="${p.fixed}" min="0.1" max="60" step="0.1"><span class="unit">px</span></div>`;
if(selectedModalTab==='field')return `<div class="mrow"><label>字段</label><select id="widthField">${selectOpts([['flow','flow'],['length','length'],['grade','grade']],p.field)}</select></div><div class="mrow"><label>乘数系数</label><input type="number" id="factor" min="0.0001" step="0.005" value="${p.factor}"></div><div class="preview-area"><span class="hint">示例字段值 125 → 线宽 ${v} px</span>${strokeSvg(widthAt(zoomPreview))}</div>`;
return `<div class="mrow"><label>变化方式</label><select id="interpolation">${selectOpts([['linear','线性插值'],['step','阶梯变化']],p.interpolation)}</select></div><table class="stop-table"><thead><tr><th>Zoom</th><th>线宽（px）</th><th style="width:50px"></th></tr></thead><tbody>${p.stops.map((x,i)=>`<tr><td><input type="number" min="0" max="24" step="0.5" data-z="${i}" value="${x.z}"></td><td><input type="number" min="0.1" max="60" step="0.1" data-v="${i}" value="${x.v}"></td><td><button data-delstop="${i}" ${p.stops.length<=2?'disabled':''} title="删除节点">×</button></td></tr>`).join('')}</tbody></table><div style="margin-top:9px"><button id="addStop" class="tiny">添加节点</button></div><div class="preview-area"><div class="section-tools"><span style="font-weight:600">预览</span><span id="previewNum" class="hint">Z${zoomPreview} · ${v} px</span></div><input style="width:100%;margin:12px 0 4px;accent-color:#547da4" type="range" id="zoomRange" min="0" max="20" step=".5" value="${zoomPreview}">${strokeSvg(widthAt(zoomPreview))}</div>`}
function strokeSvg(w){return `<svg class="preview-svg" viewBox="0 0 480 40" preserveAspectRatio="none"><path d="M15 20 H465" stroke="#267cb7" stroke-width="${Math.max(.5,Math.min(30,w*1.5))}" fill="none" stroke-linecap="round"/></svg>`}
function zoomModal(){return dialogShell('线宽 · 数据定义',`<div class="modal-tabs"><button data-width-tab="fixed" class="${selectedModalTab==='fixed'?'selected':''}">固定值</button><button data-width-tab="zoom" class="${selectedModalTab==='zoom'?'selected':''}">按缩放级别</button><button data-width-tab="field" class="${selectedModalTab==='field'?'selected':''}">按属性字段</button></div><div id="widthTabBody">${zoomTabContent()}</div>`) }
function symbolModal(){return dialogShell('线符号',`<div class="msection">基本符号</div><div class="mrow"><label>端点样式</label><select id="lineCap">${selectOpts([['round','圆形'],['butt','平直'],['square','方形']],state.advanced.lineCap)}</select></div><div class="mrow"><label>连接样式</label><select id="lineJoin">${selectOpts([['round','圆角'],['bevel','斜角'],['miter','尖角']],state.advanced.lineJoin)}</select></div><div class="mrow"><label>线偏移</label><input id="lineOffset" type="number" step=".5" value="${state.advanced.offset}"><span class="unit">px</span></div><div class="mrow"><label>虚线间隔</label><input id="dashPattern" type="text" placeholder="例如 6, 3" value="${htmlEsc(state.advanced.dash)}"></div><div class="msection">数据定义</div><div class="mrow"><label>线宽</label><button class="tiny" id="goZoom">${state.width.kind==='zoom'?'按缩放级别':state.width.kind==='field'?'按属性字段':'固定值'} · 设置…</button></div><div class="help">复杂符号图层及 SVG 图案将在后续版本扩展。</div>`) }
function ruleModal(){let x=state.rules[state.selected];if(!x)return dialogShell('规则属性',`<div class="blank">请选择规则</div>`);return dialogShell('规则属性',`<div class="kv"><label>规则名称</label><input id="ruleName" value="${htmlEsc(x.name)}"></div><div class="kv"><label>过滤表达式</label><textarea id="ruleExpr">${htmlEsc(x.expr)}</textarea></div><div class="kv"><label>最小 Zoom</label><input id="ruleMin" type="number" min="0" max="24" value="${x.minZoom}"></div><div class="kv"><label>最大 Zoom</label><input id="ruleMax" type="number" min="0" max="24" value="${x.maxZoom}"></div><div class="kv"><label>符号颜色</label><input style="width:46px;height:28px;padding:2px" id="ruleColor" type="color" value="${htmlEsc(x.color)}"></div>`) }
function manageModal(){let data=modal==='categories'?state.categories:state.graduated;let title=modal==='categories'?'分类管理':'分级断点';return dialogShell(title,`<table class="stop-table"><thead><tr><th>${modal==='categories'?'值':'上界'}</th><th>图例</th><th style="width:52px">符号</th></tr></thead><tbody>${data.map((x,i)=>`<tr><td><input type="${modal==='categories'?'text':'number'}" data-man-value="${i}" value="${htmlEsc(x.value)}"></td><td><input type="text" data-man-label="${i}" value="${htmlEsc(x.label)}"></td><td><input style="width:34px;padding:2px" type="color" data-man-color="${i}" value="${htmlEsc(x.color)}"></td></tr>`).join('')}</tbody></table><div style="margin-top:10px"><button class="tiny" id="managerAdd">添加</button></div>`) }
function ruleListModal(){return dialogShell('规则管理',`<table class="stop-table"><thead><tr><th>规则名称</th><th>表达式</th><th>缩放范围</th><th style="width:55px"></th></tr></thead><tbody>${state.rules.map((r,i)=>`<tr><td>${htmlEsc(r.name)}</td><td>${htmlEsc(r.expr||'—')}</td><td>Z${r.minZoom}–${r.maxZoom}</td><td><button class="linkbtn" data-edit-rule="${i}">编辑</button></td></tr>`).join('')}</tbody></table><div style="margin-top:9px"><button id="managerAddRule" class="tiny">添加规则</button></div>`) }
function renderModal(){if(!modal)return;let html=modal==='zoom'?zoomModal():modal==='symbol'?symbolModal():modal==='rule'?ruleModal():modal==='ruleList'?ruleListModal():manageModal();$('#modalRoot').innerHTML=html;$('#closeModal').onclick=closeModal;if($('#modalDone'))$('#modalDone').onclick=closeModal;$('.modal-backdrop').addEventListener('mousedown',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()});
if(modal==='zoom')bindZoomModal();if(modal==='symbol')bindSymbolModal();if(modal==='rule')bindRuleModal();if(modal==='ruleList'){document.querySelectorAll('[data-edit-rule]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.editRule;modal='rule';renderModal()});$('#managerAddRule').onclick=()=>addRule()};if(modal==='categories'||modal==='breaks')bindManager()}
function bindZoomModal(){document.querySelectorAll('[data-width-tab]').forEach(b=>b.onclick=()=>{selectedModalTab=b.dataset.widthTab;change(s=>s.width.kind=selectedModalTab);renderModal()});if($('#fixedSize'))$('#fixedSize').onchange=e=>{change(s=>s.width.fixed=Math.max(.1,+e.target.value||.1));renderModal()};if($('#widthField'))$('#widthField').onchange=e=>{change(s=>s.width.field=e.target.value);renderModal()};if($('#factor'))$('#factor').onchange=e=>{change(s=>s.width.factor=Math.max(.0001,+e.target.value||.001));renderModal()};if($('#interpolation'))$('#interpolation').onchange=e=>{change(s=>s.width.interpolation=e.target.value);renderModal()};document.querySelectorAll('[data-z]').forEach(i=>i.onchange=e=>{const idx=+e.target.dataset.z;const z=+e.target.value;if(!Number.isFinite(z))return;change(s=>s.width.stops[idx].z=Math.max(0,Math.min(24,z)));renderModal()});document.querySelectorAll('[data-v]').forEach(i=>i.onchange=e=>{const idx=+e.target.dataset.v;const v=+e.target.value;if(!Number.isFinite(v))return;change(s=>s.width.stops[idx].v=Math.max(.1,v));renderModal()});document.querySelectorAll('[data-delstop]').forEach(b=>b.onclick=()=>{const idx=+b.dataset.delstop;change(s=>s.width.stops.splice(idx,1));renderModal()});if($('#addStop'))$('#addStop').onclick=()=>{change(s=>{let st=s.width.stops;let z=Math.min(24,(st.at(-1)?.z??8)+2);if(st.some(p=>p.z===z))z=Math.min(24,z+.5);st.push({z,v:st.at(-1)?.v??3});st.sort((a,b)=>a.z-b.z)});renderModal()};if($('#zoomRange'))$('#zoomRange').oninput=e=>{zoomPreview=+e.target.value;$('#previewNum').textContent='Z'+zoomPreview+' · '+widthAt(zoomPreview).toFixed(2)+' px';$('.preview-svg path').setAttribute('stroke-width',Math.max(.5,Math.min(30,widthAt(zoomPreview)*1.5)))} }
function bindSymbolModal(){[['lineCap','lineCap'],['lineJoin','lineJoin'],['lineOffset','offset'],['dashPattern','dash']].forEach(([id,key])=>{const el=$('#'+id);if(el)el.onchange=e=>{change(s=>s.advanced[key]=key==='offset'?+e.target.value:e.target.value)}});$('#goZoom').onclick=()=>{modal='zoom';renderModal()}}
function bindRuleModal(){let index=state.selected;[['ruleName','name'],['ruleExpr','expr'],['ruleMin','minZoom'],['ruleMax','maxZoom'],['ruleColor','color']].forEach(([id,key])=>{$('#'+id).onchange=e=>{change(s=>{const r=s.rules[index];if(!r)return;r[key]=key==='minZoom'||key==='maxZoom'?+e.target.value:e.target.value})}})}
function bindManager(){const arr=modal==='categories'?'categories':'graduated';[['man-value','value'],['man-label','label'],['man-color','color']].forEach(([id,key])=>document.querySelectorAll('[data-'+id+']').forEach(input=>input.onchange=e=>{let idx=+e.target.dataset[id.replace('-','')];if(Number.isNaN(idx))idx=+e.target.getAttribute('data-'+id);change(s=>{s[arr][idx][key]=(arr==='graduated'&&key==='value')?+e.target.value:e.target.value});renderModal()}));$('#managerAdd').onclick=()=>{change(s=>{const a=s[arr];a.push(arr==='categories'?{value:'new_'+(a.length+1),label:'新分类',color:'#b1c9d8',count:0}:{value:(a.at(-1)?.value||0)+100,label:'新分级',color:'#b1c9d8',count:0})});renderModal()}}
$('#save').onclick=()=>{saved=JSON.stringify(state);try{localStorage.setItem('my-web-gis-style-v4',saved)}catch{}updateHeader()};$('#undo').onclick=()=>{if(!past.length)return;future.push(JSON.stringify(state));state=JSON.parse(past.pop());if(modal)renderModal();render()};$('#redo').onclick=()=>{if(!future.length)return;past.push(JSON.stringify(state));state=JSON.parse(future.pop());if(modal)renderModal();render()};$('#reset').onclick=()=>{if(!confirm('恢复默认样式？此操作可撤销。'))return;change(s=>Object.assign(s,clone(initial)))};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){closeModal();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('#save').click()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){if(e.target.matches('input,textarea'))return;e.preventDefault();$('#undo').click()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();$('#redo').click()}});
try{const found=localStorage.getItem('my-web-gis-style-v4');if(found){const data=JSON.parse(found);if(data&&data.renderer&&data.width){state=data;saved=JSON.stringify(data)}}}catch{}
render();
})();
</script>
</body>
</html>
